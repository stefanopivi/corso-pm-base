ne due persone che possono dedicarci solo metà del loro tempo. Quanto dura?","why":"Due persone al 50% valgono una persona a tempo pieno: 30 / (2 × 0,5) = 30. Lo stesso effort può dare durate molto diverse.","src":"Mod. 6 sl. 8-9, note","fields":[{"l":"Durata (giorni)","k":"num","a":30}],"wy":{"field":["Due persone al 50% valgono una persona a tempo pieno: 30 / (2 × 0,5) = 30 giorni. Errore tipico: dividere solo per 2 e rispondere 15, dimenticando la percentuale."],"trap":"Contare le persone senza considerare la percentuale di tempo dedicata: conta la capacità reale, non il numero di teste."}},{"id":"T7-07","t":"form","text":"Leggi la matrice di carico (giornate/uomo) e rispondi.","why":"Il totale di riga dimensiona il work package, il totale di colonna mostra il carico di ciascuna risorsa e segnala possibili colli di bottiglia da riequilibrare.","src":"Mod. 6 sl. 8","table":{"head":["Attività","PM","Analista","Sviluppatore","Tester"],"rows":[["Analisi","1","6","0","0"],["Sviluppo","1","2","12","0"],["Test","1","1","3","8"],["Rilascio","2","0","2","3"]]},"fields":[{"l":"(a) Totale dell'attività «Sviluppo»","k":"num","a":15},{"l":"(b) Carico totale dello Sviluppatore","k":"num","a":17},{"l":"(c) Quale risorsa è più carica?","k":"pick","opts":["PM","Analista","Sviluppatore","Tester"],"a":2}],"wy":{"field":["Si somma la riga Sviluppo: 1 + 2 + 12 + 0 = 15 giornate/uomo. Errore tipico: prendere solo il 12 dello Sviluppatore senza sommare tutta la riga.","Si somma la colonna Sviluppatore: 0 + 12 + 3 + 2 = 17. Errore tipico: scambiare riga e colonna e rispondere 15, il totale dell'attività Sviluppo.","Totali di colonna: PM 5, Analista 9, Sviluppatore 17, Tester 11. La più carica è lo Sviluppatore. Errore tipico: giudicare da una sola riga invece di sommare le colonne."],"trap":"Scambiare totale di riga (quanto pesa l'attività) e totale di colonna (quanto è carica la risorsa)."}},{"id":"T7-08","t":"single","text":"Due attività che potrebbero svolgersi in parallelo richiedono la stessa persona. Passando da una pianificazione a risorse infinite a una a risorse finite, che cosa può accadere?","why":"Un limite alle risorse ha un riflesso sulla durata. Spesso si calcola prima il piano a risorse infinite e poi si introducono i limiti.","src":"Mod. 6 sl. 9","opts":["Niente: i tempi non cambiano","La durata del progetto può aumentare, perché le attività vanno sequenziate (livellamento delle risorse)","Il costo scende automaticamente","Il progetto diventa più breve"],"a":1,"wy":{"opt":["Sbagliato: la stessa persona non può fare due attività insieme, quindi con risorse finite i tempi possono cambiare.","Giusto: la stessa persona non può lavorare su due attività insieme, quindi si mettono in sequenza (livellamento) e la fine del progetto può slittare.","Sbagliato: non c'è alcun legame automatico con il costo. Il limite alle risorse agisce soprattutto sui tempi.","Sbagliato: mettere in sequenza attività prima parallele può solo mantenere o allungare la durata, mai accorciarla."],"trap":"Credere che i limiti sulle risorse non tocchino i tempi, mentre costringono a sequenziare attività che sarebbero in parallelo."}},{"id":"T7-09","t":"single","text":"A che cosa serve la matrice di carico?","why":"Matrice di carico, RACI e Gantt guardano la stessa realtà da angolazioni diverse (impegno, responsabilità, tempo) e vanno letti insieme.","src":"Mod. 6 sl. 8, note","opts":["A mostrare la sequenza delle attività","A quantificare l'impegno di ciascuna risorsa su ciascuna attività e a individuare squilibri e sovraccarichi","A elencare i deliverable","A calcolare il percorso critico"],"a":1,"wy":{"opt":["Sbagliato: la sequenza delle attività si vede nel Gantt o nel reticolo. La matrice di carico mostra l'impegno, non l'ordine.","Giusto: righe attività e colonne risorse mostrano le giornate/uomo, e i totali rivelano squilibri e sovraccarichi.","Sbagliato: l'elenco dei deliverable è compito della WBS o della PBS, non della matrice di carico.","Sbagliato: il percorso critico si calcola sul reticolo, con durate e dipendenze. La matrice di carico non contiene dipendenze."],"trap":"Confondere la matrice di carico con Gantt, reticolo e WBS: ciascuno risponde a una domanda diversa, e la matrice dice quanto lavoro per ogni risorsa."}}]},{"key":"T8","title":"Reticolo, percorso critico e Gantt","modulo":"Modulo 6","durata":"8-10 minuti","q":[{"id":"T8-01","t":"match","text":"Abbina ogni situazione al tipo di dipendenza tra le due attività.","why":"La dipendenza Fine–Inizio è la più diffusa: la seconda attività parte quando finisce la prima. Nell'Inizio–Inizio le due attività partono insieme; nella Fine–Fine finiscono insieme. Esiste anche l'Inizio–Fine, molto rara.","src":"Mod. 6 sl. 12-13","items":["La posa del pavimento può iniziare solo quando l'impianto elettrico è finito","La stesura del manuale e la formazione degli utenti partono nello stesso giorno","La revisione dei documenti può chiudersi solo quando si chiude l'ultima bozza"],"cats":["Fine–Inizio","Inizio–Inizio","Fine–Fine"],"a":[0,1,2],"wy":{"item":["Il pavimento parte solo quando l'impianto è finito: la seconda inizia alla fine della prima, quindi Fine–Inizio. Non è Inizio–Inizio, dove partono insieme.","Manuale e formazione partono nello stesso giorno: è Inizio–Inizio. Si confonde con Fine–Inizio, in cui una parte solo dopo la fine dell'altra.","La revisione si chiude solo con l'ultima bozza: sono le due fini a essere legate, quindi Fine–Fine. Si confonde con Fine–Inizio perché una cosa precede l'altra."],"trap":"Guardare solo quale attività viene prima e non quali due momenti, inizio o fine, sono legati tra loro."}},{"id":"T8-02","t":"single","text":"Stai costruendo il Gantt di un impianto. Quale di queste voci va rappresentata come milestone (il rombo)?","why":"Una milestone è un momento rilevante del progetto, concettualmente un'attività di durata nulla, che di solito corrisponde al completamento di un deliverable o alla chiusura di una fase. Montaggio e attesa hanno una durata; la riunione periodica è un evento ricorrente, non un risultato raggiunto.","src":"Mod. 6 sl. 15","opts":["Montaggio dei moduli: 7 giorni di lavoro","Collaudo accettato dal committente: si chiude la fase di montaggio","Riunione settimanale di avanzamento","Attesa di 5 giorni per la consegna del materiale"],"a":1,"wy":{"opt":["Sbagliato: il montaggio dura 7 giorni, quindi è un'attività con una barra nel Gantt. La milestone ha durata nulla.","Giusto: il collaudo accettato è un momento a durata nulla, che chiude la fase di montaggio: si disegna con un rombo.","Sbagliato: la riunione settimanale è un evento che si ripete, non un risultato raggiunto, quindi non è una milestone.","Sbagliato: l'attesa di 5 giorni ha una durata, anche se nessuno lavora. È una barra, non un rombo."],"trap":"Chiamare milestone un'attività importante o un evento ricorrente: la milestone ha durata nulla e segna un risultato o la chiusura di una fase."}},{"id":"T8-03","t":"single","text":"Quattro attività con le loro durate. A non ha predecessori; B e C partono quando finisce A; D parte quando sono finite sia B sia C. Quanto dura al minimo il progetto?","why":"Ci sono due percorsi: A-B-D dura 2+5+2 = 9 giorni, A-C-D dura 2+3+2 = 7 giorni. D può partire solo quando sono finite sia B sia C, quindi il progetto dura quanto il percorso più lungo: 9 giorni.","src":"Mod. 6 sl. 17-18","fixed":true,"table":{"head":["Attività","Durata (giorni)","Dopo"],"rows":[["A","2","—"],["B","5","A"],["C","3","A"],["D","2","B e C"]]},"opts":["7 giorni","9 giorni","10 giorni","12 giorni"],"a":1,"wy":{"opt":["Sbagliato: 7 giorni è A-C-D (2 + 3 + 2), il percorso più corto. D parte solo quando è finita anche B, quindi il progetto dura di più.","Giusto: A-B-D dura 2 + 5 + 2 = 9 giorni, A-C-D solo 7. D aspetta anche B, quindi il progetto dura quanto il percorso più lungo.","Sbagliato: 10 si ottiene sommando 5 + 3 + 2 e dimenticando A. Ma A va contata, e B e C si svolgono in parallelo, non una dopo l'altra.","Sbagliato: 12 somma tutte le durate (2 + 5 + 3 + 2) e varrebbe solo con le attività in fila. B e C vanno in parallelo."],"trap":"Sommare tutte le durate invece di cercare il percorso più lungo: B e C si svolgono in parallelo."}},{"id":"T8-04","t":"single","text":"Nella stessa rete, qual è il percorso critico, cioè quello che determina la durata del progetto?","why":"Il percorso critico è il più lungo: A-B-D (9 giorni). Un ritardo su una sua attività sposta la fine del progetto. A-C-D dura 7 giorni, quindi non è critico.","src":"Mod. 6 sl. 18-19","fixed":true,"table":{"head":["Attività","Durata (giorni)","Dopo"],"rows":[["A","2","—"],["B","5","A"],["C","3","A"],["D","2","B e C"]]},"opts":["A → B → D","A → C → D","Tutti e due, perché partono dalla stessa attività"],"a":0,"wy":{"opt":["Giusto: A-B-D dura 9 giorni, è il percorso più lungo. Un ritardo su una sua attività sposta la fine del progetto.","Sbagliato: A-C-D dura 7 giorni, 2 meno del percorso più lungo. Ha margine, quindi non è critico.","Sbagliato: partire dalla stessa attività non rende critici due percorsi. Conta la durata totale, e qui 9 giorni sono diversi da 7."],"trap":"Scegliere un percorso a occhio, o metterli entrambi, senza sommare le durate: è critico solo il più lungo."}},{"id":"T8-05","t":"single","text":"Nella stessa rete, di quanti giorni può ritardare l'attività C senza far slittare la fine del progetto?","why":"C dura 3 giorni, mentre B, che parte e finisce negli stessi momenti, ne dura 5: C può ritardare di 5−3 = 2 giorni senza ritardare D. Questo margine si chiama float (scorrimento).","src":"Mod. 6 sl. 18-20","fixed":true,"table":{"head":["Attività","Durata (giorni)","Dopo"],"rows":[["A","2","—"],["B","5","A"],["C","3","A"],["D","2","B e C"]]},"opts":["0 giorni","1 giorno","2 giorni","3 giorni"],"a":2,"wy":{"opt":["Sbagliato: 0 giorni è il margine di un'attività critica, come B. C dura 3 contro i 5 di B, quindi ha margine.","Sbagliato: 1 giorno è un calcolo parziale. La differenza tra B (5 giorni) e C (3 giorni) è di 2 giorni.","Giusto: B dura 5 e C dura 3, e D aspetta entrambe. C può quindi ritardare di 5 − 3 = 2 giorni senza far slittare il progetto.","Sbagliato: 3 giorni è la durata di C, non il suo margine. Con 3 giorni di ritardo C finirebbe dopo B e D slitterebbe di un giorno."],"trap":"Confondere la durata dell'attività (3 giorni) con il suo margine, cioè la differenza con la durata del percorso critico (2 giorni)."}},{"id":"T8-06","t":"single","text":"Per finire prima, un collega propone di accorciare di un giorno l'attività C. Che effetto ha sulla durata del progetto?","why":"Per accorciare il progetto bisogna intervenire su un'attività del percorso critico (qui A, B o D). Accorciare un'attività che ha margine non fa guadagnare nulla.","src":"Mod. 6 sl. 18-20","table":{"head":["Attività","Durata (giorni)","Dopo"],"rows":[["A","2","—"],["B","5","A"],["C","3","A"],["D","2","B e C"]]},"opts":["Nessuno: C ha un margine di 2 giorni, quindi la fine del progetto non cambia","Il progetto finisce un giorno prima","Il percorso critico diventa A → C → D"],"a":0,"wy":{"opt":["Giusto: C ha un margine di 2 giorni, quindi accorciarla non cambia niente. La fine dipende da A-B-D, che dura ancora 9 giorni.","Sbagliato: D parte solo quando sono finite sia B sia C. B dura sempre 5 giorni, quindi il progetto dura sempre 9 giorni.","Sbagliato: accorciando C, il percorso A-C-D scende a 6 giorni e diventa ancora meno critico. Il percorso critico resta A-B-D."],"trap":"Pensare che accorciare una qualsiasi attività accorci il progetto: bisogna intervenire su un'attività del percorso critico."}},{"id":"T8-07","t":"single","text":"Il Gantt qui sotto mostra un piano di sette settimane. Tutte le dipendenze sono Fine–Inizio: ogni attività deve partire dopo la fine di quella che la precede. Quale attività viola una dipendenza?","why":"Il Test parte nella settimana 4, ma lo Sviluppo, che lo precede, finisce nella settimana 5: con una dipendenza Fine–Inizio il Test potrebbe partire al più presto nella settimana 6.","src":"Mod. 6 sl. 21-22","fixed":true,"gantt":{"weeks":7,"rows":[["Analisi",1,2],["Sviluppo",3,5],["Test",4,6],["Rilascio",7,7]]},"opts":["Analisi","Sviluppo","Test","Rilascio"],"a":2,"wy":{"opt":["Sbagliato: Analisi è nelle settimane 1-2 e non ha predecessori, quindi non può violare alcuna dipendenza.","Sbagliato: Sviluppo parte nella settimana 3, dopo la fine di Analisi nella 2. La dipendenza è rispettata: il problema nasce dopo.","Giusto: il Test parte nella settimana 4, ma lo Sviluppo finisce nella 5. Con Fine–Inizio il Test può partire al più presto nella 6.","Sbagliato: Rilascio parte nella settimana 7, dopo la fine del Test nella 6. La dipendenza è rispettata."],"trap":"Guardare l'ordine delle righe senza confrontare la fine della precedente con l'inizio della successiva."}},{"id":"T8-08","t":"single","text":"Nel Gantt del piano di sette settimane, che cosa rappresenta la lunghezza di ogni barra?","why":"Sull'asse orizzontale c'è il tempo, sul verticale le attività nell'ordine della WBS: le barre sono proporzionali alla durata, le milestone sono rombi e le frecce sono le dipendenze.","src":"Mod. 6 sl. 21-22","gantt":{"weeks":7,"rows":[["Analisi",1,2],["Sviluppo",3,5],["Test",4,6],["Rilascio",7,7]]},"opts":["Il lavoro svolto, misurato in giornate di impegno delle persone","La durata dell'attività, cioè il tempo di calendario","Il costo dell'attività","Il livello di rischio dell'attività"],"a":1,"wy":{"opt":["Sbagliato: il lavoro in giornate di impegno è l'effort, che si legge nella matrice di carico. La barra del Gantt non lo misura.","Giusto: sull'asse orizzontale c'è il tempo, e la lunghezza della barra è la durata di calendario dell'attività.","Sbagliato: il costo non si legge dalla lunghezza della barra. Il Gantt mostra tempi e dipendenze.","Sbagliato: il rischio non è rappresentato dalla lunghezza della barra. Barre lunghe indicano più tempo, non più rischio."],"trap":"Confondere durata ed effort: una barra lunga indica più tempo di calendario, non necessariamente più lavoro."}}]}];
const GLOSS = {"PM":"Project Manager, il responsabile del progetto","PMO":"Project Management Office, l'ufficio aziendale che coordina e supporta i progetti (metodi, strumenti, standard)","WBS":"Work Breakdown Structure, la scomposizione gerarchica del lavoro in deliverable e attività","PBS":"Product Breakdown Structure, la scomposizione del progetto nei risultati (deliverable) da consegnare","OBS":"Organization Breakdown Structure, la scomposizione dell'organizzazione in unità e ruoli responsabili","RAM":"Responsibility Assignment Matrix, la matrice che incrocia attività e ruoli per assegnare le responsabilità","RACI":"matrice delle responsabilità con quattro ruoli: R esegue, A risponde del risultato, C è consultato, I è informato","SAL":"stato di avanzamento lavori, il rapporto periodico su a che punto è il progetto","PERT":"Program Evaluation and Review Technique, la tecnica che stima la durata con tre valori","PDM":"Precedence Diagram Method, il reticolo in cui le attività sono i nodi e le frecce le dipendenze","ADM":"Arrow Diagram Method, il reticolo in cui le attività sono le frecce e i nodi gli eventi","ES":"Early Start, la data minima di inizio di un'attività (il più presto possibile)","EF":"Early Finish, la data minima di fine di un'attività (il più presto possibile)","FS":"dipendenza Fine–Inizio","SS":"dipendenza Inizio–Inizio","FF":"dipendenza Fine–Fine","SF":"dipendenza Inizio–Fine","IT":"tecnologie dell'informazione (sistemi informativi)","R&S":"ricerca e sviluppo","R&D":"ricerca e sviluppo"};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
/* ---------- stato ---------- */
let S = { edition: '', pid: '', view: 'home', test: null, qi: 0, filter: 'bad', statsTest: TESTS.length > 1 ? -1 : 0, key: '' };
let DB = { answers: {}, done: {} };   // risposte in corso e test consegnati, per edizione+partecipante
const dbKey = () => 'pmt:' + S.edition + ':' + S.pid;
const saveDB = () => LS.set(dbKey(), DB);
function rnd4() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(n, seedStr, notIdentity) {
  const idx = [...Array(n).keys()], r = rng(hash(seedStr));
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  if (notIdentity && n > 1 && idx.every((v, i) => v === i)) [idx[0], idx[1]] = [idx[1], idx[0]];
  return idx;
}
const perm = (q, n) => q.fixed ? [...Array(n).keys()] : shuffled(n, S.pid + q.id);
/* ---------- risposte ---------- */
const getA = (q) => (DB.answers[S.test] || {})[q.id];
function setA(q, v) { (DB.answers[S.test] = DB.answers[S.test] || {})[q.id] = v; saveDB(); }
function answered(q) {
  const a = getA(q);
  if (a === undefined || a === null) return false;
  if (q.t === 'single') return typeof a === 'number';
  if (q.t === 'multi') return a.length > 0;
  if (q.t === 'match') return a.every((x) => x !== null && x !== undefined);
  if (q.t === 'order') return true;
  if (q.t === 'form') return q.fields.every((f, i) => a[i] !== undefined && a[i] !== '' && a[i] !== null);
  return false;
}
const num = (s) => parseFloat(String(s).replace(',', '.').trim());
function check(q, a) {
  if (a === undefined || a === null) return { ok: 0, f: 0 };
  if (q.t === 'single') { const ok = a === q.a ? 1 : 0; return { ok, f: ok }; }
  if (q.t === 'multi') { const A = [...a].sort().join(), B = [...q.a].sort().join(); const ok = A === B ? 1 : 0; return { ok, f: ok }; }
  if (q.t === 'match') { const c = q.a.filter((x, i) => a[i] === x).length; return { ok: c === q.a.length ? 1 : 0, f: c / q.a.length }; }
  if (q.t === 'order') { const ord = a.length ? a : []; const c = ord.filter((x, i) => x === i).length; return { ok: c === q.items.length ? 1 : 0, f: c / q.items.length }; }

function donut(ok, tot) {

const tone = (pw) => (pw >= .5 ? 'hi' : pw >= .25 ? 'mid' : 'lo');

function statsNavHtml() {
