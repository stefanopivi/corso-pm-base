<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test in itinere — Project Management base</title>
<meta name="description" content="Test di consolidamento al termine di ogni modulo del corso di Project Management base.">
<meta name="theme-color" content="#0555FA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230555FA'/%3E%3Ctext x='50' y='68' font-size='56' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EPM%3C/text%3E%3C/svg%3E">
<style>
:root{--blue:#0555FA;--red:#E61400;--green:#008556;--ink:#111;--muted:#555;--line:#8c8c8c;--grey:#C6C6C6;--soft:#F2F3F5;--ok-bg:#E6F4EE;--ko-bg:#FDEBE8}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;line-height:1.4}
button,input{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--grey);border-top:4px solid var(--blue)}
.top-in{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:15px}.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{margin:0;font-size:28px;line-height:1.15}h2{margin:0;font-size:18px}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{margin:6px 0 16px;font-size:18px;color:var(--muted)}
[tabindex="-1"]:focus{outline:none}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#0446d4}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.seg button:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.card{background:var(--soft);border-radius:16px;padding:18px 18px 16px;margin-top:14px}
.progress{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}.progress b{color:var(--ink)}
.bar{height:8px;background:var(--grey);border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar>span{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}
.item{background:var(--soft);border-radius:16px;padding:20px 18px}
.qtype{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
.qtext{font-size:19px;font-weight:700;margin:0 0 12px;line-height:1.3}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{min-height:52px;padding:10px 12px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;display:block;width:100%;touch-action:manipulation}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.opt[aria-pressed="true"]::before,.opt[aria-checked="true"]::before{content:"✓ "}
.opt.vf{text-align:center}
.mrow{background:#fff;border:2px solid var(--grey);border-radius:12px;padding:12px;margin-bottom:10px}
.mrow p{margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{width:auto;min-height:44px;padding:8px 12px;font-size:15px;text-align:center}
.ord{list-style:none;margin:0;padding:0}
.ord li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:8px}
.ord .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.ord .t{flex:1;font-weight:700}
.ord button{width:44px;height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:18px;cursor:pointer;color:var(--ink)}
.ord button:disabled{opacity:.3}
.frow{margin-bottom:12px}.frow label{display:block;font-weight:700;margin-bottom:6px}
.frow input{width:100%;min-height:52px;font-size:20px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
table.t{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:14px;background:#fff}
table.t th,table.t td{border:1px solid var(--grey);padding:6px 8px;text-align:left}table.t th{background:var(--ink);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--grey);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:640px;margin:0 auto;display:flex;gap:8px}.nav .grow{flex:1}.nav[hidden]{display:none}
.tile{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:64px;font-size:16px;color:var(--ink)}
.tile:hover{border-color:var(--ink)}
.tile .no{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.tile b{display:block}.tile small{color:var(--muted);font-size:13px}
.tile .st{font-size:13px;font-weight:700}.tile.done .no{background:var(--green)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}.field label{font-weight:700;font-size:14px}
.field input{min-height:52px;font-size:18px;padding:0 12px;border:2px solid var(--line);border-radius:12px;width:100%}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:22px 18px;text-align:center}.hero .eyebrow{color:#d9d9d9}
.score{font-size:64px;font-weight:700;line-height:1}.score span{font-size:28px;font-weight:400;color:#d9d9d9}
.hero p{margin:10px 0 0;font-size:17px}
.seg{display:flex;gap:6px;margin:18px 0 10px}
.seg button{flex:1;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid transparent}
.row.ok{background:var(--ok-bg);border-color:#b9dfce}.row.ko{background:var(--ko-bg);border-color:#f3c3bc}
.mark{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
.ok .mark{background:var(--green)}.ko .mark{background:var(--red)}
.rname{font-weight:700}.rsol,.rmine{font-size:14px;margin-top:3px}.rmine{color:#B00F00}.rsol{color:#00694a}
.rnote{margin:8px 0 0;padding:8px 10px;background:#fff;border-radius:8px;font-size:13px;color:#333}
.bars .brow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:12px 0;font-size:14px}
.brow .bb{grid-column:1/-1;height:8px;background:var(--grey);border-radius:99px;overflow:hidden}.brow .bb span{display:block;height:100%;background:var(--green)}
.brow .bb.low span{background:var(--red)}
dialog{border:0;border-radius:18px;padding:0;width:calc(100% - 24px);max-width:600px;max-height:88vh;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;overflow:auto;max-height:88vh}.dlg h2{margin-bottom:10px}
.dlg .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.dlg .actions .btn{flex:1;min-width:130px}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.cell.done{background:var(--ink);border-color:var(--ink);color:#fff}.cell.cur{outline:3px solid var(--blue);outline-offset:1px}
.legend{font-size:13px;color:var(--muted);margin:10px 0 0}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:#fff3cd;color:#5c4400}
.small{font-size:13px;color:var(--muted)}
.gt{display:grid;gap:4px 0;margin:0 0 14px;background:#fff;border:1px solid var(--grey);border-radius:10px;padding:8px;align-items:center}
.gt .gw{font-size:11px;color:var(--muted);text-align:center;border-left:1px solid var(--grey)}
.gt .gl{font-size:13px;font-weight:700;grid-column:1}
.gt .gbar{height:20px;background:var(--blue);border-radius:4px;margin:0 1px}
.sigle{margin-top:14px;padding:10px 12px;background:#fff;border-radius:10px;font-size:13px;color:#333;border:1px solid var(--grey)}.sigle ul{margin:4px 0 0;padding-left:18px}
main.wide{max-width:960px}
.db-top{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.db-donut{width:150px;height:150px}
.db-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.db-kpi div{background:#fff;border-radius:12px;padding:10px 12px}.db-kpi b{display:block;font-size:26px;line-height:1.15}.db-kpi span{font-size:13px;color:var(--muted)}
.db-rk{margin:12px 0}.db-rkt{font-size:15px;display:flex;gap:12px;justify-content:space-between;align-items:baseline}.db-rkt>b{white-space:nowrap}.db-rkt small{font-weight:400;color:var(--muted)}
.db-track{height:14px;background:#cfe6dc;border-radius:7px;overflow:hidden;margin-top:5px}.db-track span{display:block;height:100%;background:var(--red)}
.db-pc.hi{color:#a30e00}.db-pc.mid{color:#7a5200}.db-pc.lo{color:#00623f}
.db-rowbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit;font:inherit;border-radius:10px}.db-rowbtn:hover,.db-rowbtn:focus-visible{background:#fff}
.db-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px}.db-head h2{margin:0}
details.db-card{background:var(--soft);border-radius:16px;margin-top:12px;overflow:hidden}
.db-sum{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none;min-height:56px}.db-sum::-webkit-details-marker{display:none}
.db-sum::after{content:'▾';grid-column:3;justify-self:end;font-size:18px;color:var(--muted)}details[open]>.db-sum::after{content:'▴'}
.db-sum .db-pill{grid-column:2;justify-self:start}.db-sum2{grid-template-columns:38px 1fr}
.db-rank{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}.db-rank.ok{background:var(--green)}
.db-sumt{font-size:16px;line-height:1.35}
.db-pill{font-weight:700;font-size:13px;border-radius:99px;padding:4px 12px;white-space:nowrap}.db-pill.hi{background:var(--ko-bg);color:#8a0d00}.db-pill.mid{background:#fff3cd;color:#5c4400}.db-pill.lo{background:var(--ok-bg);color:#005a3a}
.db-body{padding:0 16px 16px}.db-q{font-size:17px;font-weight:700;margin:2px 0 12px;line-height:1.4}
.db-list{list-style:none;margin:0 0 12px;padding:0}
.db-opt{background:#fff;border:2px solid var(--grey);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.db-opt.g{border-color:var(--green);background:#f3faf7}.db-opt.r{border-color:var(--red);background:#fffaf9}.db-opt.n{border-style:dashed}
.db-ot{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;font-size:15px}.db-mk{font-weight:700}.db-opt.g .db-mk{color:var(--green)}.db-opt.r .db-mk{color:var(--red)}
.db-cn{font-size:13px;font-weight:700;color:#333;text-align:right}
.db-alt{display:block;font-size:13px;color:#8a0d00;margin-top:2px}.db-ans{color:#00623f;font-weight:700}
.db-ob{height:8px;background:#eceef1;border-radius:4px;overflow:hidden;margin:8px 0 2px}.db-ob span{display:block;height:100%}.db-ob.br span{background:var(--red)}.db-ob.bg span{background:var(--green)}
.db-opt.g .db-ob span{background:var(--green)}
.db-ow{margin:6px 0 0;font-size:14px;color:#222;line-height:1.45}
.db-ok{background:var(--ok-bg);border-left:6px solid var(--green);border-radius:10px;padding:10px 14px;margin-top:12px}.db-ok p{margin:4px 0 0;font-size:15px}
.db-trap{background:#fff3cd;border-left:6px solid #c58b00;border-radius:10px;padding:10px 14px;margin-top:10px}.db-trap p{margin:4px 0 0;font-size:15px;color:#4a3800}
.db-gq{padding:8px 0;border-bottom:1px solid var(--grey);font-size:15px}
@media(max-width:560px){.db-top{grid-template-columns:1fr;justify-items:center}.db-kpi{width:100%}.db-sum{grid-template-columns:38px 1fr}.db-sum::after{display:none}.db-sum .db-pill{grid-column:2}}
@media print{.top,.nav,.noprint,dialog{display:none!important}main,main.wide{max-width:none;padding:0}details.db-card,.card,.db-opt{break-inside:avoid}body{background:#fff}}
a.lnk{color:var(--blue);font-weight:700;background:none;border:0;padding:0;cursor:pointer;font-size:inherit;text-decoration:underline}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">Project Management base<small id="sub">Test in itinere</small></div><button class="btn small" id="hbtn" hidden>Elenco test</button></div></header>
<main id="app" aria-live="polite"></main>
<div class="nav" id="nav" hidden><div class="nav-in" id="navin"></div></div>
<dialog id="dlg"><div class="dlg" id="dlgin"></div></dialog>
<script>
/*CONFIG*/
const CONFIG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbwqkz7-Y_wKe6jHYf6k5mWEiPeeZAmrx9l_e-jwmtdeuOHP_piZnNzBZFrkSx3SYtf7/exec',            // indirizzo del servizio che raccoglie le risposte (vuoto = modalità prova, dati solo su questo dispositivo)
  statsKey: 'docente',     // chiave per la pagina statistiche (in modalità prova); con un servizio la verifica la fa il servizio
  appVersion: 1
};
/*DATA*/
const TESTS = [{"key":"T1","title":"Che cos'è un progetto","modulo":"Modulo 1","durata":"7-8 minuti","q":[{"id":"T1-01","t":"match","text":"Per ciascuna attività scegli: Progetto, Processo, Compito oppure «Dipende – informazioni insufficienti».","why":"Il nome non conta e nemmeno la novità del risultato: contano temporaneità, unicità, complessità e il fatto che lo faccia un team ad hoc o una struttura stabile. Del sito web non sappiamo né la complessità né chi lo fa: il PM non etichetta a sensazione, chiede.","src":"Mod. 1 sl. 10-11; Es. 1.1","items":["Emissione mensile delle fatture ai clienti","Costruzione di una nuova sede commerciale a Bologna: 120 persone di quattro funzioni da trasferire, budget e data di apertura assegnati, team dedicato per 14 mesi","Prenotare la sala per la riunione di giovedì","Gestione quotidiana del servizio clienti","Lancio di una nuova offerta commerciale con un team temporaneo di Marketing, IT, Legale e Vendite, budget e data di lancio definiti","Aggiornamento del sito web aziendale"],"cats":["Progetto","Processo","Compito","Dipende – informazioni insufficienti"],"a":[1,0,2,1,0,3],"wy":{"item":["Processo: è un lavoro che si ripete ogni mese, sempre uguale, svolto dalla struttura stabile. Non è un compito singolo né un progetto.","Progetto: ha inizio e fine, team dedicato interfunzionale, budget e data assegnati e un risultato unico. La durata lunga non lo rende un processo.","Compito: è una singola azione semplice, senza team dedicato e senza risultato complesso. Non va confuso con un progetto solo perché ha una scadenza.","Processo: è un lavoro quotidiano e continuativo di una struttura permanente, senza fine prevista. Il fatto che sia importante non lo rende un progetto.","Progetto: team temporaneo di funzioni diverse, risultato nuovo, budget e data definiti. Non è un processo, perché nasce per l'occasione e poi si scioglie.","Dipende: non sappiamo quanto sia complesso né chi lo svolga. Potrebbe essere un compito o un progetto, quindi il PM non etichetta a sensazione ma chiede."],"trap":"Etichettare l'attività dal nome o dalla novità del risultato, invece di guardare temporaneità, unicità, complessità e chi la svolge."}},{"id":"T1-02","t":"single","text":"Quale tra queste NON è una caratteristica distintiva di un progetto?","why":"Il lavoro ripetitivo e continuativo svolto da una struttura permanente è la definizione di processo («business as usual»).","src":"Mod. 1 sl. 11","opts":["Risultato unico","Organizzazione specifica ma temporanea","Svolgimento ripetitivo e continuativo da parte di una struttura stabile","Vincoli di tempo e di costo"],"a":2,"wy":{"opt":["È una caratteristica del progetto: produce un risultato unico, che prima non esisteva.","È una caratteristica del progetto: il team viene formato per l'occasione e poi si scioglie.","Giusta: è la definizione di processo, il lavoro ordinario di una struttura permanente, non di progetto.","È una caratteristica del progetto: ha tempi e costi limitati, definiti in partenza."],"trap":"Scambiare la definizione di processo, cioè lavoro ripetitivo e continuativo, con quella di progetto."}},{"id":"T1-03","t":"single","text":"«Un'attività che produce un risultato nuovo è sempre un progetto.» Qual è la risposta giusta?","why":"Se l'ufficio R&S di un'azienda sviluppa ogni anno nuovi modelli lavora per processo, anche se ogni modello è nuovo. Si distingue cosa si produce (qualcosa di nuovo) da come lo si produce (per processo o per progetto).","src":"Es. 1.1 (la «trappola» dell'attività 11)","opts":["Vero: se il risultato è nuovo, è un progetto","Falso: è un progetto se complesso, se lo produce un team temporaneo e interfunzionale costituito ad hoc","Falso: i progetti non producono mai risultati nuovi","Falso: solo le iniziative sotto i tre anni sono progetti"],"a":1,"wy":{"opt":["Sbagliata: un risultato nuovo non basta. Se una struttura stabile produce novità ogni anno, come l'ufficio R&S, lavora per processo.","Giusta: un risultato nuovo non basta. È un progetto se il lavoro è complesso e lo svolge un team temporaneo e interfunzionale costituito ad hoc; se lo fa una struttura stabile in modo continuativo è un processo.","Sbagliata: i progetti producono proprio risultati unici. L'unicità è uno dei loro tratti distintivi.","Sbagliata: la durata non decide. Un progetto può durare mesi o anni, ciò che conta è che abbia un inizio e una fine."],"trap":"Pensare che la novità del risultato basti a fare un progetto, senza guardare come viene prodotto."}},{"id":"T1-04","t":"single","text":"«Temporaneo» significa di breve durata e si applica anche al risultato che il progetto crea.","why":"Temporaneo vuol dire con un inizio e una fine definiti, non necessariamente breve. Non riguarda il risultato: la maggior parte dei progetti crea risultati durevoli (una sede, un impianto, un sistema).","src":"Mod. 1 sl. 9, note","fixed":true,"opts":["Vero","Falso"],"a":1,"wy":{"opt":["Sbagliata: temporaneo non vuol dire breve, ma con un inizio e una fine definiti. E non riguarda il risultato.","Giusta: la temporaneità è del progetto, non del risultato. Una sede, un impianto o un sistema durano a lungo."],"trap":"Confondere temporaneo con breve, e pensare che anche il risultato del progetto debba essere temporaneo."}},{"id":"T1-06","t":"multi","text":"Quali sono i quattro tratti distintivi indicati nella slide «Che cos'è un progetto»?","why":"Gli obiettivi impliciti nella struttura e la ripetizione sono tratti dell'attività corrente, non del progetto, dove gli obiettivi sono invece chiari ed espliciti.","src":"Mod. 1 sl. 10, note","opts":["Insieme di attività complesse e interrelate","Risultato unitario e specifico","Obiettivi impliciti nella struttura organizzativa","Tempo predefinito e limitato","Ciclicità e ripetizione delle attività","Utilizzo di un insieme di risorse"],"a":[0,1,3,5],"wy":{"opt":["Giusta: il progetto è un insieme di attività complesse e interrelate, non compiti separati.","Giusta: il progetto punta a un risultato unitario e specifico, che prima non c'era.","Sbagliata: gli obiettivi impliciti nella struttura sono tipici dell'attività corrente. Nel progetto gli obiettivi sono chiari ed espliciti.","Giusta, spesso dimenticata: il progetto ha un tempo predefinito e limitato, con inizio e fine.","Sbagliata: ciclicità e ripetizione sono tratti dell'attività corrente, cioè del processo, non del progetto.","Giusta, spesso dimenticata: il progetto usa un insieme di risorse, assegnate per realizzarlo."],"trap":"Scegliere i tratti dell'attività corrente, come ripetizione e obiettivi impliciti, e dimenticare tempo limitato e risorse."}},{"id":"T1-07","t":"single","text":"Il reparto IT sta migrando i dati dei clienti su una nuova piattaforma. Non sono stati fissati né una data di fine né un budget: «si va avanti finché serve». Dopo 18 mesi il team è ancora al lavoro e i requisiti continuano a crescere. Quale lettura è corretta?","why":"I limiti di tempo e di costo servono proprio perché un progetto, per definizione, deve avere un inizio e una fine. Se il committente non li dà (come in certi progetti di ricerca e sviluppo) li definisce il team con la pianificazione. La durata lunga e i requisiti che evolvono non trasformano un progetto in un processo.","src":"Mod. 1 sl. 9-11, note","opts":["È un processo, perché dura molto e continua nel tempo","Ha un risultato unico ma gli mancano i vincoli di tempo e costo: senza una fine e un budget definiti rischia di non concludersi mai, come la «fabbrica del Duomo». Va fissato un limite, anche dal team con la pianificazione se il committente non lo dà","È un progetto ben avviato: i vincoli di tempo e costo non sono tratti distintivi del progetto","Non è un progetto perché i requisiti cambiano: un progetto ha requisiti fissi per tutta la durata"],"a":1,"wy":{"opt":["Sbagliata: durare a lungo non trasforma un progetto in processo. Il risultato resta unico e il lavoro non è ripetitivo.","Giusta: ha risultato unico ma mancano tempo e costo. Senza fine e budget rischia di non chiudersi mai, quindi li fissa il team con la pianificazione.","Sbagliata: i vincoli di tempo e costo sono proprio tratti distintivi del progetto. Senza di essi si perde il controllo.","Sbagliata: i requisiti possono evolvere in un progetto. Non è questo che decide se lo sia o meno."],"trap":"Credere che l'assenza di scadenza e budget, o la lunga durata, cambi la natura del lavoro da progetto a processo."}},{"id":"T1-08","t":"multi","text":"L'ufficio Ricerca e Sviluppo di un'azienda, struttura stabile, sviluppa ogni anno nuovi modelli a catalogo e chiama «Progetto Modello 2027» l'ultimo sviluppo. Per decidere se è davvero un progetto, quali informazioni ti servono? Seleziona le tre che contano.","why":"Il nome non rende progetto un'attività, e nemmeno l'output nuovo o la durata. Contano il modo di lavorare (struttura permanente e continuativa contro team temporaneo costituito per l'occasione), i vincoli definiti e l'interrelazione delle attività tra funzioni.","src":"Mod. 1 sl. 10-11; Es. 1.1","opts":["Se lo svolge la struttura stabile come attività ordinaria oppure un team temporaneo costituito ad hoc","Se ha un inizio e una fine definiti, con obiettivi, tempi e budget assegnati","Se coinvolge più funzioni con compiti interrelati","Se nel nome compare la parola «Progetto»","Se il risultato è diverso da quello dello scorso anno","Se dura più di un anno"],"a":[0,1,2],"wy":{"opt":["Giusta: conta se lavora la struttura stabile come attività ordinaria o un team temporaneo costituito per l'occasione.","Giusta: un progetto ha inizio e fine definiti, con obiettivi, tempi e budget assegnati. Senza vincoli non è un progetto.","Giusta, spesso dimenticata: i progetti coinvolgono più funzioni con compiti interrelati. Qui bisogna verificarlo.","Sbagliata: il nome non rende progetto un'attività. Si chiama «Progetto» anche ciò che è ordinario lavoro di una struttura.","Sbagliata: un risultato diverso dal precedente non basta. Anche un processo ripetuto può produrre ogni volta qualcosa di nuovo.","Sbagliata: la durata non distingue progetto e processo. Contano vincoli definiti e modo di lavorare, non quanto dura."],"trap":"Farsi guidare da nome, novità o durata, invece che da modo di lavorare, vincoli definiti e interrelazione tra funzioni."}}]},{"key":"T2","title":"Competenze del Project Manager","modulo":"Modulo 2","durata":"5-6 minuti","q":[{"id":"T2-01","t":"match","text":"Per ciascuna frase scegli la competenza chiave del Project Manager a cui si riferisce.","why":"Sono le quattro competenze chiave che fanno da filo conduttore ai moduli successivi: guidare e motivare le persone, pianificare, organizzare, controllare.","src":"Mod. 2 sl. 6","items":["Far sì che le persone diano il massimo e realizzino una prestazione eccellente","Stabilire come si raggiungeranno i risultati del progetto","Trovare l'equilibrio operativo tra obiettivi, risorse e vincoli","Verificare a che punto è il progetto e intervenire in tempo con le correzioni necessarie"],"cats":["Guidare – motivare","Pianificare","Organizzare","Controllare"],"a":[0,1,2,3],"wy":{"item":["Guidare – motivare: riguarda le persone e la loro prestazione. Non è controllare, che si occupa di misurare l'avanzamento.","Pianificare: significa stabilire come si raggiungeranno i risultati. Non è organizzare, che cerca l'equilibrio tra obiettivi, risorse e vincoli.","Organizzare: è trovare l'equilibrio operativo tra obiettivi, risorse e vincoli. Si confonde con pianificare, che decide invece il percorso.","Controllare: verificare a che punto si è e correggere in tempo. Si confonde con guidare, perché anche questo riguarda il team."],"trap":"Confondere pianificare con organizzare, perché entrambe sembrano riguardare il «come» del progetto."}},{"id":"T2-02","t":"single","text":"Quale frase definisce il Project Manager (e non il Project Management)?","why":"La prima frase definisce il Project Management (insieme di conoscenze e tecniche), la terza il project charter, la quarta il PMO.","src":"Mod. 2 sl. 3","opts":["Applicazione di conoscenze, competenze, strumenti e tecniche alle attività di progetto per soddisfarne i requisiti","Persona incaricata del raggiungimento degli obiettivi di progetto","Documento che autorizza formalmente l'esistenza del progetto","Ufficio che coordina tutti i progetti dell'azienda"],"a":1,"wy":{"opt":["Sbagliata: è la definizione di Project Management, cioè l'insieme di conoscenze e tecniche, non della persona.","Giusta: il Project Manager è la persona incaricata di raggiungere gli obiettivi del progetto.","Sbagliata: è la definizione di project charter, il documento che autorizza formalmente il progetto.","Sbagliata: è la definizione di PMO, l'ufficio che coordina i progetti dell'azienda."],"trap":"Confondere persona, disciplina, documento e ufficio: Project Manager, Project Management, charter e PMO suonano simili."}},{"id":"T2-03","t":"single","text":"Il committente chiede di anticipare del 30% la consegna senza aggiungere risorse e senza ridurre il perimetro. Che cosa è più probabile, nella logica della triade risultati–tempo–risorse?","why":"Tempo, risorse e risultati sono legati: se ne comprimi uno senza agire sugli altri, paga il terzo. Il PM serve a bilanciarli.","src":"Mod. 2 sl. 2","opts":["Nulla: basta lavorare meglio","Un compromesso sul risultato (qualità o perimetro) oppure un forte rischio di non rispettare i tempi","Una riduzione automatica dei costi","Un aumento automatico delle risorse"],"a":1,"wy":{"opt":["Sbagliata: lavorare meglio non basta. Tempo, risorse e risultati sono legati, quindi comprimere il tempo ha conseguenze.","Giusta: se anticipi senza più risorse né meno perimetro, paga il terzo lato: risultato più scadente o forte rischio di ritardo.","Sbagliata: anticipare non riduce i costi da sola. Spesso li aumenta, e comunque non c'entra con la logica della triade.","Sbagliata: le risorse non aumentano da sole. Vanno richieste e negoziate, e qui il committente non le ha concesse."],"trap":"Pensare che si possa comprimere un lato della triade senza conseguenze sugli altri due."}},{"id":"T2-04","t":"multi","text":"Se siamo responsabili di un progetto, di quali capacità abbiamo bisogno? Seleziona quelle corrette.","why":"Il Project Manager non è il tecnico più bravo né il custode di un piano immutabile, e non decide da solo su ciò che riguarda committente e sponsor: tiene insieme persone, tempi, rischi e accordi.","src":"Mod. 2, soluzione Es. 2.2","opts":["Gestire e motivare le persone del team","Comunicare e negoziare con committente, sponsor e fornitori","Valutare persone, costi, investimenti e rischi","Conoscere ogni attività tecnica meglio di chiunque nel team, per poterne verificare personalmente la qualità","Difendere il piano iniziale senza modifiche, per dare stabilità al team","Decidere da soli sulle questioni di budget, per essere più rapidi"],"a":[0,1,2],"wy":{"opt":["Giusta: il PM guida le persone del team e ne cura la motivazione.","Giusta: il PM comunica e negozia con committente, sponsor e fornitori. È una parte centrale del ruolo.","Giusta, spesso dimenticata: il PM valuta persone, costi, investimenti e rischi per tenere insieme il progetto.","Sbagliata: il PM non deve essere il tecnico più bravo. Si affida agli esperti del team e coordina.","Sbagliata: difendere il piano senza modifiche è rigidità. Il PM aggiorna il piano quando le condizioni cambiano.","Sbagliata: il budget riguarda committente e sponsor. Il PM non decide da solo su ciò che li coinvolge."],"trap":"Immaginare il PM come il tecnico più bravo o come custode del piano, invece che come chi tiene insieme persone e accordi."}},{"id":"T2-05","t":"match","text":"A quale competenza chiave corrisponde ciascuna situazione?","why":"Le competenze si intrecciano nella pratica, ma ciascuna ha un baricentro riconoscibile: pianificare è decidere come arrivare al risultato, organizzare è trovare l'equilibrio tra obiettivi, risorse e vincoli, controllare è misurare e correggere in tempo, guidare è far rendere le persone.","src":"Mod. 2 sl. 6","items":["Scompone il lavoro, stima durate e costi e definisce la sequenza delle attività per stabilire come arrivare al risultato","Si accorge che gli obiettivi richiesti non sono raggiungibili con le risorse e i vincoli disponibili e negozia un equilibrio: riduce il perimetro oppure chiede più risorse","Ogni settimana confronta l'avanzamento reale con il piano e, vedendo uno scarto, adotta una misura correttiva","Riconosce il contributo di ciascuno e coinvolge il team nelle decisioni per mantenere alta la prestazione"],"cats":["Guidare – motivare","Pianificare","Organizzare","Controllare"],"a":[1,2,3,0],"wy":{"item":["Pianificare: scomporre il lavoro, stimare durate e costi e definire la sequenza serve a stabilire come arrivare al risultato. Si confonde con organizzare.","Organizzare: negoziare un equilibrio tra obiettivi, risorse e vincoli, riducendo il perimetro o chiedendo risorse. Si confonde con pianificare.","Controllare: confrontare avanzamento reale e piano e correggere se c'è uno scarto. Si confonde con pianificare, che però viene prima.","Guidare – motivare: riconoscere il contributo e coinvolgere il team fa rendere le persone. Non è organizzare, che riguarda obiettivi e risorse."],"trap":"Scegliere dalle parole chiave invece che dal baricentro: le competenze si intrecciano, ma ciascuna ha uno scopo prevalente."}},{"id":"T2-06","t":"single","text":"Secondo il corso, il successo di un progetto significa…","why":"Il successo non è solo «consegnare»: gestire questo equilibrio è il mestiere del PM.","src":"Mod. 1 sl. 14","opts":["Consegnare nei tempi, qualunque sia il costo","Bilanciare qualità, tempi, costi e soddisfazione del committente","Spendere meno del budget","Chiudere il progetto prima possibile"],"a":1,"wy":{"opt":["Sbagliata: consegnare in tempo non basta. Se per farlo si sfora il budget o si sacrifica la qualità, il progetto non è un successo.","Giusta: il successo è bilanciare qualità, tempi, costi e soddisfazione del committente. Gestire questo equilibrio è il mestiere del PM.","Sbagliata: spendere meno del budget è solo un aspetto dei costi. Si può risparmiare e consegnare un risultato scadente.","Sbagliata: chiudere in fretta non è un obiettivo in sé. Rischia di sacrificare qualità e soddisfazione."],"trap":"Ridurre il successo a un solo criterio, tempi o costi, invece di vederlo come equilibrio tra più aspetti."}}]},{"key":"T3","title":"Ciclo di vita e controllo","modulo":"Modulo 3","durata":"10-12 minuti","q":[{"id":"T3-01","t":"order","text":"Metti in ordine le fasi del ciclo di vita del progetto.","why":"Il controllo non è una fase a sé: corre in parallelo a partire dall'esecuzione.","src":"Mod. 3 sl. 3","items":["Ideazione e avviamento","Definizione e pianificazione","Esecuzione","Completamento"],"wy":{"item":["Si parte qui: si valuta l'idea e si decide se il progetto vale la pena. Senza questo passo non c'è nulla da pianificare.","Dopo la decisione di fare il progetto si stabilisce come farlo: WBS, tempi, costi, rischi. Viene prima dell'esecuzione, non insieme.","Si realizza il lavoro secondo il piano. Il controllo non è una fase a parte: parte da qui e corre in parallelo all'esecuzione.","Ultima fase: si consegna, si chiude e si analizza com'è andata. Il controllo non ne prende il posto come fase finale."],"trap":"Inserire il controllo come quinta fase dopo l'esecuzione, mentre in realtà corre in parallelo a partire dall'esecuzione."}},{"id":"T3-02","t":"match","text":"In quale fase viene prodotto ciascun deliverable?","why":"Ogni fase ha i suoi deliverable chiave: è la logica che struttura tutto il modulo.","src":"Mod. 3 sl. 4-7","items":["Project charter","Mappa degli stakeholder","Work Breakdown Structure","Mappa dei rischi","Stato di avanzamento lavori","Analisi ex post e lessons learned"],"cats":["Ideazione e avviamento","Definizione e pianificazione","Esecuzione","Completamento"],"a":[0,0,1,1,2,3],"wy":{"item":["Il charter autorizza il progetto, quindi nasce nell'ideazione. Si confonde con la definizione perché è un documento formale, ma precede la pianificazione.","Gli stakeholder si individuano già all'avvio, per capire chi può influenzare la decisione. Si sbaglia mettendola in pianificazione perché poi si aggiorna.","La WBS scompone il lavoro ed è un prodotto della definizione e pianificazione. Si confonde con l'ideazione perché si pensa a un'idea generale.","La mappa dei rischi si costruisce nella pianificazione, prima di partire. Si sbaglia scegliendo l'esecuzione perché i rischi poi si manifestano lì.","Lo stato di avanzamento misura il lavoro in corso rispetto al piano, quindi è dell'esecuzione. Si confonde con il completamento perché è un resoconto.","L'analisi ex post e le lessons learned si fanno a lavoro finito, nel completamento. Si confonde con l'esecuzione perché si impara anche durante."],"trap":"Collocare i documenti per l'argomento che trattano (rischi, stakeholder) invece che per il momento in cui vengono prodotti."}},{"id":"T3-03","t":"single","text":"In quale fase si decide SE realizzare il progetto?","why":"Nell'ideazione si decide se fare il progetto; nella definizione si decide come farlo.","src":"Mod. 3 sl. 4-5, note","fixed":true,"opts":["Ideazione e avviamento","Definizione e pianificazione","Esecuzione","Completamento"],"a":0,"wy":{"opt":["Giusta: nell'ideazione si valuta l'idea e si decide se fare il progetto oppure fermarsi.","Sbagliata: qui il progetto è già deciso e si stabilisce come farlo, con piano, tempi, costi e rischi.","Sbagliata: in esecuzione si realizza ciò che è già stato deciso e pianificato, non si decide più se farlo.","Sbagliata: il completamento chiude un progetto già realizzato; qui non si decide più nulla sull'avvio."],"trap":"Confondere il «se» con il «come»: pianificare presuppone che la decisione di fare il progetto sia già stata presa."}},{"id":"T3-04","t":"single","text":"«Un progetto abbandonato dopo la valutazione preliminare è un fallimento della gestione.»","why":"Molti progetti «muoiono» correttamente nell'ideazione: nelle gare d'appalto ogni concorrente avvia un proprio mini-progetto di valutazione, ma ne viene scelto uno solo. Saper fermarsi in tempo fa parte del valore della fase.","src":"Mod. 3 sl. 9-10, note","fixed":true,"opts":["Vero","Falso"],"a":1,"wy":{"opt":["Sbagliata: fermarsi dopo la valutazione non è un fallimento. Nelle gare, per esempio, molti mini-progetti di valutazione si chiudono perché ne vince uno solo.","Giusta: saper fermare un progetto in tempo, nell'ideazione, fa parte del valore della fase ed evita di sprecare risorse."],"trap":"Pensare che ogni progetto avviato debba essere completato, e che abbandonarlo sia sempre un errore di gestione."}},{"id":"T3-05","t":"single","text":"Che cos'è il project charter?","why":"È la «carta d'identità del progetto» e il ponte tra ideazione e pianificazione. Si pensi alla carta con cui i sovrani di Spagna misero a disposizione di Colombo navi e uomini.","src":"Mod. 3 sl. 15-16","opts":["La scomposizione del lavoro in work package","Il documento che autorizza formalmente il progetto e dà mandato e autorità al Project Manager","Il verbale della riunione di avvio con il team","Il piano dettagliato dei costi"],"a":1,"wy":{"opt":["Sbagliata: questa è la WBS, che scompone il lavoro in work package. Il charter autorizza, non scompone.","Giusta: il charter è la carta d'identità del progetto; autorizza l'avvio e dà al PM mandato e autorità.","Sbagliata: il verbale registra una riunione. Il charter viene prima e non è il resoconto di un incontro.","Sbagliata: il piano dei costi nasce nella pianificazione. Il charter è un documento di avvio e non entra in tale dettaglio."],"trap":"Scambiare il charter con un documento operativo (WBS, verbale, piano costi) invece che con l'atto di autorizzazione."}},{"id":"T3-07","t":"single","text":"Qual è lo scopo del kick-off meeting?","why":"Il kick-off è il momento formale di avvio con il team; la decisione se fare il progetto è stata presa prima, nell'ideazione.","src":"Mod. 3 sl. 20, note","opts":["Decidere se avviare o no il progetto","Avviare formalmente il lavoro con il team, allineando obiettivi, ruoli e regole di ingaggio","Calcolare il percorso critico","Fare il consuntivo del progetto"],"a":1,"wy":{"opt":["Sbagliata: la decisione se fare il progetto si prende prima, nell'ideazione. Il kick-off parte quando è già deciso.","Giusta: il kick-off è l'avvio formale con il team: si allineano obiettivi, ruoli e regole di ingaggio.","Sbagliata: il percorso critico si calcola con la pianificazione dei tempi, non è lo scopo della riunione di avvio.","Sbagliata: il consuntivo si fa a progetto concluso, in chiusura. Il kick-off sta all'inizio."],"trap":"Attribuire al kick-off la decisione di avviare il progetto, mentre quella è già presa e il kick-off ne è solo l'avvio con il team."}},{"id":"T3-08","t":"order","text":"Metti in ordine il ciclo di monitoraggio e controllo.","why":"Si parte dalla misura dell'avanzamento reale rispetto al piano, si valuta lo scostamento e se ne prevedono gli effetti, si agisce con le correzioni e si ripianifica.","src":"Mod. 6 sl. 25","items":["Misurare l'avanzamento reale e confrontarlo con il piano","Valutare lo scostamento e prevederne le conseguenze","Agire con le misure correttive","Ripianificare"],"wy":{"item":["Si comincia misurando cosa è stato fatto davvero e confrontandolo con il piano. Senza questo dato non si sa se c'è uno scostamento.","Dopo la misura si valuta di quanto ci si è scostati e quali effetti avrà su tempi e costi finali.","Solo dopo aver capito lo scostamento e le sue conseguenze si decide quali misure correttive prendere.","Alla fine si aggiorna il piano con le correzioni decise, così diventa il nuovo riferimento per le misure successive."],"trap":"Agire subito con azioni correttive senza prima misurare e valutare lo scostamento e le sue conseguenze."}},{"id":"T3-09","t":"multi","text":"Quali attività appartengono alla fase di chiusura?","why":"La chiusura è spesso la fase trascurata: ma senza analisi ex post non si capisce quanto fossero giuste le stime e gli errori si ripetono nei progetti successivi.","src":"Mod. 3 sl. 7; Mod. 6 sl. 25","opts":["Consegna del risultato agli utilizzatori","Test e avviamento","Raccolta dei requisiti","Analisi ex post, lessons learned e aggiornamento degli archivi","Scomposizione del progetto in WBS"],"a":[0,1,3],"wy":{"opt":["Giusta: la consegna del risultato agli utilizzatori chiude il progetto. Si dimentica perché sembra già parte dell'esecuzione.","Giusta: test e avviamento servono a consegnare un risultato funzionante, quindi sono del completamento. Il termine «avviamento» non indica la fase di avvio.","Sbagliata: i requisiti si raccolgono all'inizio, nell'ideazione e nella definizione, non a progetto concluso.","Giusta: l'analisi ex post, le lessons learned e l'aggiornamento degli archivi sono la parte trascurata: senza di esse gli errori si ripetono.","Sbagliata: la WBS è un prodotto della pianificazione. A fine progetto semmai si confronta il risultato con quanto pianificato."],"trap":"Scambiare «test e avviamento» per attività iniziali per via della parola «avviamento», o dimenticare la consegna come parte della chiusura."}}]},{"key":"T4","title":"Gli stakeholder","modulo":"Modulo 3","durata":"8-10 minuti","q":[{"id":"T4-01","t":"single","text":"Un'azienda trasferisce un servizio in una nuova sede. Un'associazione di quartiere non ha alcun ruolo nel progetto né potere di decisione, ma teme l'aumento del traffico. È uno stakeholder?","why":"La definizione è ampia: stakeholder è chi può influenzare, essere influenzato o percepirsi interessato da una decisione, attività o risultato del progetto. Comprende anche chi subisce le conseguenze, senza ruolo formale.","src":"Mod. 3 sl. 22","opts":["No: non partecipa al progetto e non decide","Sì: può essere influenzata dal progetto o percepirsi interessata dai suoi effetti, anche senza ruolo formale","Sì, ma solo se ha il potere di bloccare le autorizzazioni","Solo se presenta un reclamo formale"],"a":1,"wy":{"opt":["Sbagliata: non serve partecipare né decidere. Stakeholder è anche chi subisce le conseguenze del progetto.","Giusta: l'associazione può essere influenzata dagli effetti del progetto e si percepisce interessata, anche senza ruolo formale.","Sbagliata: il potere di bloccare le autorizzazioni misura l'influenza, non l'essere stakeholder. Si può esserlo anche senza alcun potere.","Sbagliata: il reclamo formale non è una condizione. Basta poter essere influenzati o sentirsi interessati dal progetto."],"trap":"Considerare stakeholder solo chi ha un ruolo o un potere formale, escludendo chi subisce gli effetti del progetto."}},{"id":"T4-02","t":"single","text":"Chi finanzia il progetto, lo promuove all'interno dell'organizzazione, incarica formalmente il PM con il project charter ed è il riferimento per l'escalation?","why":"Lo sponsor non coincide con il committente: finanzia, dice che cosa vuole, fa da portavoce ai livelli superiori e autorizza le modifiche di ambito e le decisioni go/no go.","src":"Mod. 3 sl. 22, note","opts":["Il cliente finale","Lo sponsor","L'ufficio aziendale che coordina e supporta tutti i progetti (PMO)","Il fornitore principale"],"a":1,"wy":{"opt":["Sbagliata: il cliente finale usa il risultato, ma di norma non finanzia il progetto né incarica il PM con il charter.","Giusta: lo sponsor finanzia, promuove, incarica il PM con il charter ed è il riferimento per l'escalation e le decisioni go/no go.","Sbagliata: il PMO coordina e supporta i progetti, ma non li finanzia né nomina il PM con il charter.","Sbagliata: il fornitore realizza una parte del lavoro e non finanzia né promuove il progetto nell'organizzazione."],"trap":"Confondere lo sponsor con il committente o con il cliente finale, mentre chi finanzia e promuove il progetto è lo sponsor."}},{"id":"T4-03","t":"match","text":"Una catena di supermercati introduce le casse automatiche in 40 punti vendita. Colloca ciascun soggetto nel quadrante. Interesse = quanto il progetto incide sul suo ambito; potere = quanto può incidere su impostazione, esecuzione e risultati.","why":"Interesse = quanto il progetto incide sull'ambito dello stakeholder. Potere = quanto lo stakeholder può incidere su impostazione, esecuzione e risultati.","src":"Mod. 3 sl. 24, note","items":["Il direttore generale, che finanzia e promuove il progetto","I cassieri, il cui lavoro cambierà","L'ente di controllo che deve autorizzare gli apparecchi ma segue poco il progetto","I residenti del quartiere che non frequentano il negozio"],"cats":["Chiave","Istituzionale","Operativo","Marginale"],"a":[0,2,1,3],"wy":{"item":["Finanzia e promuove, quindi ha interesse e potere alti: è chiave. Non è istituzionale perché segue il progetto da vicino.","Il progetto cambia il loro lavoro quotidiano (interesse alto) ma decidono poco: sono operativi. Non sono chiave perché hanno poco potere.","Può bloccare l'avvio con l'autorizzazione (potere alto) ma segue poco il progetto: è istituzionale. Non è chiave perché l'interesse è basso.","Non frequentano il negozio, quindi il progetto incide poco su di loro e loro poco sul progetto: marginali, non operativi."],"trap":"Invertire interesse e potere: l'ente di controllo ha potere ma poco interesse, i cassieri hanno interesse ma poco potere."}},{"id":"T4-04","t":"match","text":"Abbina ogni modo di comunicare al quadrante degli stakeholder a cui conviene.","why":"La strategia segue il quadrante: chi ha potere e interesse si gestisce da vicino; chi ha potere ma poco interesse va tenuto soddisfatto per evitare sorprese; chi ha interesse ma poco potere va ascoltato; chi ha poco di entrambi va semplicemente tenuto informato.","src":"Mod. 3 sl. 26","items":["Coinvolgerlo nelle decisioni e aggiornarlo con frequenza","Rispettarne il ruolo e prevenire le sorprese, con contatti mirati e puntuali","Raccogliere con regolarità le sue osservazioni, perché vive il progetto ogni giorno","Comunicazioni periodiche essenziali, senza assorbire energie"],"cats":["Chiave","Istituzionale","Operativo","Marginale"],"a":[0,1,2,3],"wy":{"item":["Chi ha potere e interesse alti è chiave: si coinvolge nelle decisioni. Si confonde con l'istituzionale, che invece va solo tenuto soddisfatto.","Ha potere ma poco interesse: è istituzionale. Va tenuto soddisfatto e senza sorprese, con contatti mirati, non coinvolto di continuo.","Ha interesse ma poco potere: è operativo. Vive il progetto ogni giorno, quindi si ascolta con regolarità, anche se non decide.","Ha poco potere e poco interesse: è marginale. Basta tenerlo informato in modo essenziale, senza assorbire energie."],"trap":"Ricordare il quadrante ma sbagliare la strategia: coinvolgere nelle decisioni chi ha solo potere, o trascurare chi ha solo interesse."}},{"id":"T4-05","t":"single","text":"Un comitato di residenti contrari ha poco potere formale. Perché non va comunque trascurato?","why":"Potere formale basso non significa capacità di influenza bassa. Va ascoltato in modo strutturato, con incontri e misure di mitigazione.","src":"Mod. 3 / Caso 3.1, soluzione","opts":["Perché i residenti hanno sempre ragione","Perché può ritardare i lavori agendo su autorità locali e opinione pubblica","Perché è obbligatorio per legge invitarli al kick-off","Perché finanzia il progetto"],"a":1,"wy":{"opt":["Sbagliata: non è questione di ragione o torto. Un comitato contrario si considera per la capacità di influenzare il progetto.","Giusta: poco potere formale non vuol dire poca influenza: può ritardare i lavori agendo su autorità locali e opinione pubblica.","Sbagliata: non è un obbligo di legge a rendere importante il comitato. Conta la sua capacità di influenza, non un adempimento.","Sbagliata: il comitato non finanzia nulla. Il suo peso viene dall'influenza, non dai soldi."],"trap":"Identificare il potere con quello formale o economico, dimenticando che anche chi è contrario può influenzare tempi e risultato."}},{"id":"T4-06","t":"single","text":"«L'identificazione degli stakeholder si fa una volta sola, in avvio di progetto.»","why":"È un processo continuo lungo l'intero ciclo di vita: livelli di responsabilità e autorità cambiano nel tempo e accorgersi tardi di uno stakeholder importante (per esempio l'ufficio legale) causa ritardi e costi.","src":"Mod. 3 sl. 22, note","fixed":true,"opts":["Vero","Falso"],"a":1,"wy":{"opt":["Sbagliata: l'identificazione non si fa una volta sola. Responsabilità e autorità cambiano nel tempo, quindi la mappa va aggiornata.","Giusta: è un processo continuo per tutto il ciclo di vita. Accorgersi tardi di uno stakeholder, come l'ufficio legale, causa ritardi e costi."],"trap":"Trattare la mappa degli stakeholder come un documento di avvio da compilare una volta e archiviare."}},{"id":"T4-07","t":"multi","text":"Quali tra queste sono tecniche di identificazione degli stakeholder indicate nel modulo?","why":"Matrice di carico e Gantt sono strumenti di pianificazione, non di identificazione.","src":"Mod. 3 sl. 24","opts":["Brainstorming","Check list","Rappresentazione (ricostruire in modo simulato l'ambiente di progetto)","Matrice di carico","Diagramma di Gantt"],"a":[0,1,2],"wy":{"opt":["Giusta: il brainstorming è una tecnica di identificazione indicata nel modulo, utile per far emergere chi è coinvolto.","Giusta: la check list aiuta a non dimenticare categorie di stakeholder già incontrate in altri progetti.","Giusta: la rappresentazione ricostruisce in modo simulato l'ambiente di progetto per far emergere gli stakeholder. Spesso si dimentica.","Sbagliata: la matrice di carico serve a pianificare le risorse, non a identificare gli stakeholder.","Sbagliata: il Gantt serve a pianificare i tempi, non a identificare gli stakeholder."],"trap":"Scegliere strumenti di pianificazione (matrice di carico, Gantt) perché noti, e dimenticare la rappresentazione."}},{"id":"T4-08","t":"single","text":"Nel progetto delle casse automatiche i cassieri non sono i destinatari finali (i clienti dei supermercati), ma la loro collaborazione condiziona il risultato. Che cosa implica per la mappatura degli stakeholder?","why":"Serve una mappatura precisa dei destinatari a più livelli: spesso si analizza solo il cliente finale e si trascura chi dovrà far funzionare la soluzione. I cassieri hanno alto interesse e potere limitato sulle decisioni, ma molto sull'adozione: vanno ascoltati.","src":"Mod. 3 sl. 22, note","opts":["Vanno mappati come gruppo distinto dai consumatori, con bisogni e strategia propri, perché l'adozione dipende dal loro atteggiamento","Basta mappare i consumatori: i cassieri seguiranno le indicazioni dell'azienda","Vanno considerati stakeholder marginali, perché non pagano il progetto né ne decidono l'impostazione","Conviene unire cassieri e consumatori in un unico gruppo «utenti», per semplificare la mappa"],"a":0,"wy":{"opt":["Giusta: i cassieri vanno mappati come gruppo a sé, con bisogni e strategia propri, perché da loro dipende l'adozione della soluzione.","Sbagliata: mappare solo il cliente finale è l'errore frequente. Chi deve far funzionare la soluzione può condizionare il risultato.","Sbagliata: hanno alto interesse e molto peso sull'adozione, anche se poco sulle decisioni. Non sono marginali: vanno ascoltati.","Sbagliata: unire cassieri e consumatori nasconde bisogni diversi. Serve una mappatura precisa dei destinatari a più livelli."],"trap":"Considerare solo il cliente finale e trascurare chi, pur non essendo destinatario, deve far funzionare la soluzione."}}]},{"key":"T5","title":"PBS e WBS","modulo":"Modulo 4","durata":"12-15 minuti","q":[{"id":"T5-01","t":"match","text":"Nel progetto «Nuova linea ferroviaria locale» ciascuna voce è un deliverable (PBS) oppure un'attività (WBS)?","why":"Il deliverable è ciò che si consegna e si fa accettare, e si esprime con un sostantivo; l'attività è ciò che si fa per ottenerlo, e si esprime con un verbo all'infinito.","src":"Mod. 4 sl. 8-12","items":["Manuale di manutenzione","Redigere il manuale di manutenzione","Verbale di collaudo","Collaudare la linea","Autorizzazione alla messa in servizio","Ottenere l'autorizzazione alla messa in servizio"],"cats":["Deliverable (PBS)","Attività (WBS)"],"a":[0,1,0,1,0,1],"wy":{"item":["È un sostantivo: dice che cosa si consegna e si fa accettare, quindi è un deliverable. Si confonde con l'attività «Redigere il manuale».","Inizia con un verbo all'infinito: è il lavoro da svolgere per ottenere il manuale, quindi un'attività della WBS, non il documento consegnato.","È un sostantivo: è un documento che si consegna e si fa accettare, quindi un deliverable. Non è l'azione di collaudare, che è l'attività.","Verbo all'infinito: è l'azione che produce il verbale di collaudo. È un'attività, non il risultato finale che viene consegnato.","È un sostantivo: l'autorizzazione è un risultato che si ottiene e si consegna, quindi un deliverable, anche se per averla serve molto lavoro.","Verbo all'infinito: descrive il lavoro per arrivare all'autorizzazione. L'attività è il fare, il deliverable è l'autorizzazione stessa ottenuta."],"trap":"Scambiare il documento con l'azione che lo produce: il sostantivo è il deliverable, il verbo all'infinito è l'attività."}},{"id":"T5-02","t":"single","text":"Qual è la differenza fra PBS e WBS?","why":"Prima si definisce che cosa ottenere (sostantivi), poi come ottenerlo (verbi). Da ogni foglia della PBS discendono le attività della WBS.","src":"Mod. 4 sl. 8-9","opts":["Nessuna, sono sinonimi","La PBS scompone i risultati da consegnare (che cosa), la WBS scompone il lavoro da svolgere (come)","La PBS riguarda i costi, la WBS i tempi","La PBS è per i progetti IT, la WBS per tutti gli altri"],"a":1,"wy":{"opt":["Sbagliato: sono due strutture diverse. La PBS parte dai risultati, la WBS dal lavoro necessario per ottenerli, e vanno costruite in quest'ordine.","Giusto: la PBS dice che cosa si consegna (sostantivi), la WBS come lo si ottiene (verbi). Dalle foglie della PBS discendono le attività della WBS.","Sbagliato: costi e tempi non sono l'oggetto di queste strutture. Arrivano dopo, con la pianificazione, una volta definiti risultati e lavoro.","Sbagliato: PBS e WBS valgono per ogni tipo di progetto, non solo per quelli IT. Non esiste una divisione per settore."],"trap":"Pensare che PBS e WBS siano la stessa cosa o si distinguano per costi e tempi, invece che per risultati (che cosa) e lavoro (come)."}},{"id":"T5-03","t":"multi","text":"Ecco la WBS (abbozzo) del progetto «Blog aziendale per le scuole medie». Seleziona le tre voci da correggere.","why":"La WBS aggrega per prodotto, non per responsabilità (per quello c'è la RAM). I livelli dei deliverable hanno nomi, le attività verbi all'infinito, e nulla si genera né si disperde passando da un livello all'altro. Attenzione: scomporre per fasi non è sempre consigliabile, perché si finisce per ricalcare il calendario invece del prodotto; di norma conviene partire dai deliverable.","src":"Mod. 4 sl. 11-12, note","fixed":true,"opts":["1  Piattaforma del blog","2  Contenuti editoriali","2.1  Pianificare il calendario editoriale","2.2  Pubblicare i contenuti","3  Attività dell'ufficio Marketing","3.1  Pubblicare i contenuti","3.2  Promuovere il blog sui social","4  Sviluppare la grafica","5  Project Management"],"a":[4,5,7],"wy":{"opt":["Corretta: «Piattaforma del blog» è un deliverable con nome da sostantivo, al primo livello, come deve essere. Non va corretta.","Corretta: «Contenuti editoriali» è un deliverable con un nome da sostantivo. Il ramo è coerente e non va modificato.","Corretta: sotto un deliverable stanno le attività, e «Pianificare il calendario editoriale» è un verbo all'infinito. Va bene così.","Corretta: «Pubblicare i contenuti» è un'attività nel suo ramo naturale, quello dei contenuti. Il problema è che compare anche altrove.","Da correggere: è un ramo per responsabilità (l'ufficio Marketing), non per prodotto. Chi fa che cosa si mostra nella RAM, non nella WBS.","Da correggere: «Pubblicare i contenuti» è già al punto 2.2. La stessa attività due volte genera un doppione: il lavoro va contato una volta sola.","Corretta: promuovere il blog è lavoro reale e va tenuto. Si sposta nel ramo giusto dei deliverable; non è la voce da correggere.","Da correggere: è un verbo al livello dei deliverable. Al suo posto serve un sostantivo, ad esempio «Grafica del blog», con sotto l'attività.","Corretta: il Project Management è lavoro necessario e va indicato al primo livello. Anzi, la sua assenza sarebbe un errore."],"trap":"Non vedere che un ramo è per responsabilità e non per prodotto, che un'attività è duplicata e che un verbo sta al posto di un deliverable."}},{"id":"T5-04","t":"single","text":"Un collega presenta la WBS del progetto «Blog aziendale»: contiene tutte le attività tecniche (piattaforma, contenuti, grafica, promozione) e la considera completa. Che obiezione fai?","why":"La WBS deve contenere tutto il lavoro necessario: oltre ai rami dei deliverable servono, al primo livello, le attività di integrazione e di Project Management, altrimenti il progetto è incompleto. Costi e date non fanno parte della WBS: arrivano dopo, con la pianificazione.","src":"Mod. 4 sl. 11-12, note","opts":["Nessuna: la WBS contiene il lavoro tecnico, che è quello che produce i risultati","Mancano le attività indirette, come il coordinamento, l'integrazione e la gestione del progetto: la WBS deve coprire il 100% del lavoro, non solo quello tecnico","Manca l'elenco dei costi di ogni attività","Mancano le date di inizio e di fine di ogni attività"],"a":1,"wy":{"opt":["Sbagliato: il lavoro tecnico non basta. Coordinare, integrare e gestire il progetto sono lavoro vero e vanno incluse, altrimenti la WBS è incompleta.","Giusto: la WBS deve coprire il 100% del lavoro, comprese le attività di integrazione e di Project Management al primo livello.","Sbagliato: i costi non fanno parte della WBS. Si associano alle attività più tardi, quando si pianifica, partendo dalla WBS già completa.","Sbagliato: le date non appartengono alla WBS. Arrivano dopo, con reticolo e Gantt, una volta definito tutto il lavoro da fare."],"trap":"Credere che la WBS contenga solo il lavoro tecnico, o che debba già avere costi e date, dimenticando le attività indirette di gestione."}},{"id":"T5-05","t":"single","text":"«Un'attività che non compare nella WBS può essere comunque assegnata, contabilizzata e pianificata.»","why":"Metodologicamente le attività non riportate nella WBS non possono essere né assegnate, né contabilizzate, né pianificate: la WBS è il «linguaggio ufficiale» del progetto (la Stele di Rosetta).","src":"Mod. 4 sl. 11, note","fixed":true,"opts":["Vero","Falso"],"a":1,"wy":{"opt":["Sbagliato: il lavoro fuori dalla WBS non esiste ufficialmente nel progetto, quindi non può essere assegnato, contabilizzato né pianificato.","Giusto: la WBS è il «linguaggio ufficiale» del progetto, come la Stele di Rosetta. Ciò che non vi compare non si assegna, non si contabilizza e non si pianifica."],"trap":"Pensare che si possa gestire un'attività anche se non è nella WBS, mentre è proprio la WBS a rendere il lavoro assegnabile e misurabile."}},{"id":"T5-06","t":"single","text":"Fino a che punto si scompone una WBS?","why":"Non esiste un livello ideale in assoluto: se la WBS non «tiene» quando la si usa per assegnare responsabilità, costi e tempi, si torna indietro e la si affina.","src":"Mod. 4 sl. 11-13, note","opts":["Sempre fino al sesto livello","Fino a che il livello consente di assegnare responsabilità, costi e tempi e di controllare il lavoro (come regola euristica, attività tra 4 e 40 ore)","Fino a singole azioni di un'ora","Fino al dettaglio di ogni singolo componente fisico dell'opera"],"a":1,"wy":{"opt":["Sbagliato: non esiste un numero di livelli fisso. Il giusto livello dipende dal progetto e da ciò che serve per gestirlo.","Giusto: si scende finché si possono assegnare responsabilità, costi e tempi e controllare il lavoro. Per orientarsi, attività tra 4 e 40 ore.","Sbagliato: scendere a un'ora genera una WBS ingestibile, con troppo dettaglio da controllare. Il dettaglio serve solo quanto basta a gestire.","Sbagliato: elencare ogni componente fisico è un eccesso. La WBS riguarda il lavoro da gestire, non l'inventario di tutti i pezzi."],"trap":"Cercare un livello di dettaglio fisso, o spingersi a un dettaglio eccessivo, invece di fermarsi quando la WBS permette di gestire."}},{"id":"T5-07","t":"single","text":"Quale coppia di denominazioni rispetta le regole della WBS?","why":"I livelli dei deliverable sono sostantivi che dicono che cosa si consegna; le attività sono verbi all'infinito che dicono che cosa si fa.","src":"Mod. 4 sl. 11, note (denominazione)","opts":["Deliverable: «Sviluppare il software» · Attività: «Specifiche funzionali»","Deliverable: «Software applicativo» · Attività: «Redigere le specifiche funzionali»","Deliverable: «Software» · Attività: «Software»","Deliverable: «Fase di sviluppo» · Attività: «Sviluppo»"],"a":1,"wy":{"opt":["Sbagliato: sono invertiti. «Sviluppare il software» è un verbo, quindi un'attività, e «Specifiche funzionali» è un sostantivo, quindi un deliverable.","Giusto: il deliverable è un sostantivo («Software applicativo»), l'attività è un verbo all'infinito («Redigere le specifiche funzionali»).","Sbagliato: la stessa parola per deliverable e attività non le distingue. Il risultato è un nome, il lavoro è un verbo all'infinito.","Sbagliato: «Fase di sviluppo» ricalca il calendario più che il prodotto, e «Sviluppo» non è un verbo all'infinito. Nessuna delle due segue le regole."],"trap":"Invertire le denominazioni: mettere il verbo sul deliverable e il sostantivo sull'attività, o usare lo stesso termine per entrambi."}},{"id":"T5-08","t":"single","text":"«Nella WBS sono rappresentate le dipendenze tra gli elementi.»","why":"La WBS dice di che cosa è fatto il progetto, non in che ordine. La sequenza si costruisce più avanti con il reticolo logico.","src":"Mod. 4 sl. 12, note","fixed":true,"opts":["Vero","Falso"],"a":1,"wy":{"opt":["Sbagliato: la WBS elenca di che cosa è fatto il progetto, non l'ordine in cui si fa. Le dipendenze non compaiono.","Giusto: la WBS non mostra la sequenza. Le dipendenze si definiscono più avanti con il reticolo logico."],"trap":"Confondere la WBS con il reticolo: la WBS dice che cosa va fatto, non in che ordine."}},{"id":"T5-09","t":"order","text":"Metti in ordine i passi della pianificazione.","why":"Prima si definisce che cosa consegnare (PBS), poi il lavoro da fare (WBS); si stimano le durate, si definisce la sequenza delle attività (reticolo) e si calcola il Gantt, che porta il piano sul calendario. Nella pratica si torna spesso indietro.","src":"Mod. 4 sl. 5; Mod. 6","items":["PBS","WBS","Stima delle durate","Reticolo logico","Gantt"],"wy":{"item":["Primo passo: si definisce che cosa consegnare, cioè i risultati. Senza sapere che cosa ottenere non si può decidere quale lavoro serva.","Secondo: dai deliverable della PBS discende il lavoro necessario per ottenerli, e la WBS elenca le attività da svolgere.","Terzo: solo quando si conoscono le attività si stima quanto durano. Prima di averle non c'è nulla a cui assegnare una durata.","Quarto: con le durate stimate si definisce la sequenza delle attività, cioè le dipendenze, costruendo il reticolo logico.","Ultimo: il Gantt porta il piano sul calendario, calcolato a partire dal reticolo e dalle durate. Viene alla fine, non prima."],"trap":"Anticipare reticolo o Gantt prima di avere PBS e WBS, o scambiare PBS e WBS: prima il che cosa, poi il come, poi il quando."}},{"id":"T5-10","t":"match","text":"Due gruppi costruiscono la WBS dello stesso progetto con metodi diversi. Abbina ogni gruppo al metodo che sta usando.","why":"Nel metodo top-down si parte dall'alto (i deliverable) e si scende fino alle attività. Nel bottom-up si parte dal basso: si elencano deliverable e attività in ordine sparso, si eliminano i duplicati, si aggregano per classi e si ordinano in livelli. Sono due metodi validi: contano completezza e coerenza.","src":"Mod. 4 sl. 14","items":["Il gruppo parte dai deliverable (manuale, piattaforma, grafica) e li scompone, livello dopo livello, nelle attività necessarie","Il gruppo scrive su dei post-it tutte le attività che gli vengono in mente, poi elimina i doppioni e li raggruppa sotto i deliverable"],"cats":["Top-down","Bottom-up"],"a":[0,1],"wy":{"item":["Parte dai deliverable e scende livello dopo livello fino alle attività: è il top-down. Il bottom-up fa il percorso contrario, dal basso.","Parte dalle attività in ordine sparso, toglie i doppioni e raggruppa: è il bottom-up. Il top-down parte invece dai deliverable."],"trap":"Confondere la direzione: top-down parte dall'alto (deliverable), bottom-up dal basso (attività raccolte alla rinfusa, poi raggruppate)."}}]},{"key":"T6","title":"OBS, RAM e RACI","modulo":"Modulo 5","durata":"8-10 minuti","q":[{"id":"T6-01","t":"single","text":"Che cosa scompone l'OBS (Organization Breakdown Structure)?","why":"La WBS scompone il cosa (deliverable e attività), l'OBS il chi (unità organizzative): sono i due assi da cui nascono le matrici delle responsabilità.","src":"Mod. 5 sl. 3","opts":["I deliverable di progetto","Le attività di progetto","Le responsabilità di progetto: chi risponde di che cosa e chi riporta a chi","I costi di progetto"],"a":2,"wy":{"opt":["Sbagliato: i deliverable li scompone la PBS. L'OBS riguarda le persone e le unità organizzative, non i risultati.","Sbagliato: le attività le scompone la WBS. L'OBS non elenca il lavoro, ma chi se ne occupa.","Giusto: l'OBS scompone il chi, cioè le unità organizzative: chi risponde di che cosa e chi riporta a chi. Insieme alla WBS dà le matrici.","Sbagliato: i costi non sono scomposti dall'OBS. Dipendono dal lavoro e dalle risorse, e si trattano nella pianificazione economica."],"trap":"Confondere il chi (OBS) con il cosa (WBS): l'OBS scompone le unità organizzative, non deliverable né attività."}},{"id":"T6-02","t":"single","text":"Dall'incrocio di che cosa nascono le matrici RAM e RACI?","why":"Si mettono in relazione i compiti definiti nella WBS con le unità organizzative responsabili.","src":"Mod. 5 sl. 4","opts":["Attività della WBS (righe) e ruoli o unità dell'OBS (colonne)","Costi e tempi","Deliverable e rischi","Fasi e stakeholder"],"a":0,"wy":{"opt":["Giusto: si incrociano i compiti della WBS (righe) con le unità o i ruoli dell'OBS (colonne). Ogni cella dice chi fa che cosa.","Sbagliato: costi e tempi non danno le matrici delle responsabilità. Quelle nascono dal collegare il lavoro alle persone.","Sbagliato: i rischi non entrano in queste matrici. Mettono in relazione il lavoro della WBS con le unità organizzative responsabili.","Sbagliato: fasi e stakeholder non sono gli assi di RAM e RACI. Servono il lavoro (WBS) e l'organizzazione (OBS)."],"trap":"Non ricordare che le matrici incrociano WBS e OBS, cioè il lavoro con chi lo svolge, e non altre coppie di elementi del progetto."}},{"id":"T6-03","t":"match","text":"Abbina ogni significato alla lettera della RACI.","why":"Il passaggio chiave è la differenza fra chi esegue e chi risponde del lavoro.","src":"Mod. 5 sl. 6","items":["svolge materialmente il lavoro","risponde del risultato (uno solo per attività)","fornisce pareri prima della decisione","è tenuto al corrente dell'esito"],"cats":["R","A","C","I"],"a":[0,1,2,3],"wy":{"item":["Chi svolge materialmente il lavoro è il Responsible (R). Si confonde con A: chi esegue non è per forza chi risponde del risultato.","Chi risponde del risultato è l'Accountable (A), uno solo per attività. Si confonde con R, che esegue, ma non risponde in ultima istanza.","Chi dà pareri prima della decisione è il Consulted (C). Si confonde con I, che invece viene solo informato a cose fatte.","Chi è tenuto al corrente dell'esito è l'Informed (I). Si confonde con C: l'informato non partecipa alla decisione, la riceve."],"trap":"Scambiare R con A (chi esegue contro chi risponde) o C con I (chi dà pareri prima contro chi viene informato dopo)."}},{"id":"T6-04","t":"single","text":"Qual è la differenza fra RAM e RACI?","why":"Sono due livelli di dettaglio dello stesso strumento: la RAM è una semplice matrice a X con codici WBS, la RACI usa le lettere R/A/C/I con una legenda.","src":"Mod. 5 sl. 4-6","opts":["La RAM indica solo chi partecipa a ciascuna attività; la RACI specifica con quale tipo di responsabilità","La RAM è per le attività, la RACI per i costi","La RAM riguarda i fornitori, la RACI i clienti","Nessuna"],"a":0,"wy":{"opt":["Giusto: la RAM è una matrice a X che dice solo chi partecipa; la RACI aggiunge con quale responsabilità (R, A, C, I), con una legenda.","Sbagliato: né la RAM né la RACI riguardano i costi. Entrambe sono matrici di responsabilità sul lavoro della WBS.","Sbagliato: né l'una né l'altra riguardano fornitori e clienti. Sono lo stesso strumento a due livelli di dettaglio.","Sbagliato: una differenza c'è, ed è il livello di dettaglio. La RAM indica la partecipazione, la RACI il tipo di responsabilità."],"trap":"Pensare che RAM e RACI siano strumenti diversi o uguali, invece di due livelli di dettaglio: partecipazione (RAM) e tipo di responsabilità (RACI)."}},{"id":"T6-05","t":"multi","text":"Nella RACI qui sotto (R esegue, A risponde del risultato, C è consultato, I è informato) alcune attività hanno un errore. Ricorda le due regole: per ogni attività c'è un solo A e almeno un R. Seleziona le attività da correggere.","why":"Collaudo ha due Accountable (PM e Tester) e nessun Responsible; Rilascio in esercizio non ha nessun Accountable. Documentazione è corretta: più R sulla stessa attività sono ammessi, più A no.","src":"Mod. 5 sl. 6","fixed":true,"table":{"head":["Attività","PM","Analista","Sviluppatore","Tester"],"rows":[["Raccolta requisiti","A","R","I","—"],["Sviluppo","A","C","R","I"],["Collaudo","A","I","C","A"],["Rilascio in esercizio","—","R","R","I"],["Documentazione","A","R","R","C"]]},"opts":["Raccolta requisiti","Sviluppo","Collaudo","Rilascio in esercizio","Documentazione"],"a":[2,3],"wy":{"opt":["Corretta: c'è una sola A (PM) e un R (Analista). Rispetta entrambe le regole, quindi non va corretta.","Corretta: una A (PM) e un R (Sviluppatore). Le altre sigle (C, I) non creano problemi. Non va corretta.","Da correggere: ha due A (PM e Tester) e nessun R. Le regole chiedono una sola A e almeno un R: sbagliata due volte.","Da correggere: ha due R ma nessuna A. Nessuno risponde del risultato, e per ogni attività deve esserci una A.","Corretta: più R sulla stessa attività sono ammessi, e c'è una sola A (PM). Molti la segnano per errore a causa dei due R."],"trap":"Pensare che due R siano un errore (Documentazione) e non controllare che ogni riga abbia esattamente una A e almeno un R."}},{"id":"T6-06","t":"single","text":"«In una RACI, per ogni attività può esserci più di un Responsible, ma un solo Accountable.»","why":"Vedi la domanda precedente: l'unicità riguarda chi risponde del risultato, non chi esegue.","src":"Mod. 5 sl. 6","fixed":true,"opts":["Vero","Falso"],"a":0,"wy":{"opt":["Giusto: possono eseguire in molti (più R), ma risponde del risultato uno solo (una A), altrimenti nessuno ne risponde davvero.","Sbagliato: la regola è proprio questa. Più R sono ammessi; più A no, perché la responsabilità del risultato non si divide."],"trap":"Confondere chi esegue con chi risponde: l'unicità vale per la A (il risultato), non per gli R (l'esecuzione)."}},{"id":"T6-07","t":"form","text":"Una squadra è composta da 3 persone. Ciascuna persona lavora 20 giorni sul progetto e produce 2 schede al giorno. Quante schede produce in totale la squadra?","why":"Capacità di produzione = produttività × tempo disponibile, e il tempo disponibile è il numero di persone per i giorni di ciascuna: 2 schede/giorno × (3 persone × 20 giorni) = 120 schede. È una stima di massima per un piano di massima.","src":"Mod. 5 sl. 7","fields":[{"l":"Schede prodotte in totale","k":"num","a":120}],"wy":{"field":["Giorni-persona = 3 × 20 = 60; moltiplicati per 2 schede al giorno fanno 120. Errore tipico: dimenticare il numero di persone e rispondere 40."],"trap":"Calcolare solo una persona (20 × 2 = 40) o dimenticare i giorni: la capacità è produttività × persone × giorni."}},{"id":"T6-08","t":"single","text":"Secondo il modulo, da quali fattori dipende la produttività?","why":"Il numero di risorse e il tempo entrano nel calcolo del tempo disponibile, non della produttività.","src":"Mod. 5 sl. 7","opts":["Esperienza × motivazione × capacità","Budget × durata","Numero di riunioni × qualità dei verbali","Numero di risorse × tempo"],"a":0,"wy":{"opt":["Giusto: la produttività dipende da esperienza, motivazione e capacità delle persone, cioè da come lavorano, non da quante sono.","Sbagliato: budget e durata non misurano quanto rende una persona. Sono vincoli del progetto, non fattori di produttività.","Sbagliato: le riunioni e i verbali non determinano la produttività. Sono strumenti di gestione, non caratteristiche di chi lavora.","Sbagliato: numero di risorse e tempo servono a calcolare il tempo disponibile, non la produttività. Qui si confondono i due fattori."],"trap":"Mettere tra i fattori della produttività il numero di risorse e il tempo, che entrano invece nel tempo disponibile."}}]},{"key":"T7","title":"Stime, effort e matrice di carico","modulo":"Modulo 6","durata":"12-14 minuti","q":[{"id":"T7-01","t":"match","text":"Abbina il metodo di stima alla descrizione.","why":"Le due stime si usano in momenti diversi: all'inizio, quando le informazioni sono poche, e dopo la scomposizione.","src":"Mod. 6 sl. 6","items":["stima di massima iniziale per avere un ordine di grandezza, rapida ma poco accurata","stima specifica dopo la scomposizione in work package, più accurata ma più onerosa"],"cats":["Top-down","Bottom-up"],"a":[0,1],"wy":{"item":["Stima di massima all'inizio, con poche informazioni: è top-down. La si confonde con la bottom-up, che invece richiede prima la scomposizione in work package.","Dopo la scomposizione si stima ogni work package e si somma: è bottom-up, più accurata ma più onerosa. Non è top-down, che parte dall'insieme."],"trap":"Scambiare le due stime: la top-down è rapida e iniziale, la bottom-up arriva dopo la scomposizione ed è più precisa."}},{"id":"T7-02","t":"match","text":"Abbina la tecnica di stima alla sua logica.","why":"Spesso se ne usano diverse per parti diverse del progetto.","src":"Mod. 6 sl. 7","items":["confronto con progetti simili già completati","valori unitari × volumi di attività","giudizio di soggetti competenti","valore ottimistico, pessimistico e probabile"],"cats":["Analogia","Parametrica","Parere di esperti (anche Delphi)","Tre punti / PERT"],"a":[0,1,2,3],"wy":{"item":["Si guardano durate e costi di progetti simili già chiusi: è l'analogia. La si confonde con il parere di esperti, che è un giudizio e non un confronto.","Si moltiplica un valore unitario per un volume di attività: è la stima parametrica. Non è analogia, che confronta progetti interi e non usa un moltiplicatore.","Si chiede il giudizio a chi conosce bene il lavoro, anche con il metodo Delphi: è il parere di esperti. Non parte da tre valori numerici come il PERT.","Tre valori, ottimistico, pessimistico e probabile, combinati in una media pesata: è la stima a tre punti (PERT). Non è un semplice parere di esperti."],"trap":"Confondere analogia e parere di esperti, oppure attribuire a una tecnica il nome di un'altra senza guardare su che cosa si basa."}},{"id":"T7-03","t":"form","text":"Per un'attività le stime sono: ottimistica 10 giorni, probabile 14, pessimistica 30. Calcola il valore atteso con la formula PERT.","why":"(4 × probabile + ottimistico + pessimistico) / 6 = (56 + 10 + 30) / 6 = 16.","src":"Mod. 6 sl. 7 e 17","fields":[{"l":"Valore atteso (giorni)","k":"num","a":16}],"wy":{"field":["(4 × 14 + 10 + 30) / 6 = 96 / 6 = 16 giorni. Errore tipico: la media semplice (18), cioè non pesare il valore probabile."],"trap":"Usare la media semplice (18) invece della media pesata PERT, in cui il valore probabile conta quattro volte."}},{"id":"T7-04","t":"single","text":"Con gli stessi dati la media semplice dei tre valori dà 18. Perché la PERT dà 16?","why":"La PERT è una media pesata: il valore probabile conta quattro volte più degli estremi, e questo la rende meno sensibile ai valori anomali.","src":"Mod. 6 sl. 7 e 17","opts":["Perché sottrae il valore pessimistico","Perché pesa quattro volte il valore più probabile","Perché ignora il valore ottimistico","Perché arrotonda per difetto"],"a":1,"wy":{"opt":["Falso: la formula non sottrae niente, somma tutti e tre i valori e dà più peso al probabile.","Giusto: nella formula (4 × probabile + ottimistico + pessimistico) / 6 il probabile conta quattro volte, quindi il pessimistico 30 spinge meno verso l'alto della media semplice.","Falso: l'ottimistico entra nel calcolo con peso 1, come il pessimistico. Nessun valore viene ignorato.","Falso: (56 + 10 + 30) / 6 dà esattamente 16, senza bisogno di arrotondare. Il risultato è diverso per il peso dei valori."],"trap":"Pensare che la PERT tolga o scarti un valore, mentre li usa tutti e dà peso quattro al probabile."}},{"id":"T7-05","t":"form","text":"Un'attività richiede 30 giornate/uomo. Se la affidi a 3 persone a tempo pieno e il lavoro è divisibile, quanti giorni di calendario dura?","why":"L'effort misura la quantità di lavoro, la durata dipende anche da quante risorse lavorano: 30 / 3 = 10.","src":"Mod. 6 sl. 8-9, note","fields":[{"l":"Durata (giorni di calendario)","k":"num","a":10}],"wy":{"field":["30 giornate/uomo divise per 3 persone a tempo pieno danno 10 giorni. Errore tipico: confondere effort e durata e rispondere 30, o moltiplicare e ottenere 90."],"trap":"Confondere effort (quantità di lavoro) e durata (tempo di calendario): la durata si ottiene dividendo per le risorse."}},{"id":"T7-06","t":"form","text":"Per la stessa attività da 30 giornate/uomo hai a disposizio
