<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test in itinere — Project Management base</title>
<meta name="description" content="Test di consolidamento al termine di ogni modulo del corso di Project Management base.">
<meta name="theme-color" content="#0555FA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230555FA'/%3E%3Ctext x='50' y='68' font-size='56' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EPM%3C/text%3E%3C/svg%3E">
<style>
:root{--blue:#0555FA;--red:#E61400;--green:#008556;--ink:#111;--muted:#555;--line:#8c8c8c;--grey:#C6C6C6;--soft:#F2F3F5;--ok-bg:#E6F4EE;--ko-bg:#FDEBE8}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;line-height:1.4}
button,input{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--grey);border-top:4px solid var(--blue)}
.top-in{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:15px}.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{margin:0;font-size:28px;line-height:1.15}h2{margin:0;font-size:18px}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{margin:6px 0 16px;font-size:18px;color:var(--muted)}
[tabindex="-1"]:focus{outline:none}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#0446d4}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.seg button:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.card{background:var(--soft);border-radius:16px;padding:18px 18px 16px;margin-top:14px}
.progress{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}.progress b{color:var(--ink)}
.bar{height:8px;background:var(--grey);border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar>span{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}
.item{background:var(--soft);border-radius:16px;padding:20px 18px}
.qtype{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
.qtext{font-size:19px;font-weight:700;margin:0 0 12px;line-height:1.3}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{min-height:52px;padding:10px 12px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;display:block;width:100%;touch-action:manipulation}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.opt[aria-pressed="true"]::before,.opt[aria-checked="true"]::before{content:"✓ "}
.opt.vf{text-align:center}
.mrow{background:#fff;border:2px solid var(--grey);border-radius:12px;padding:12px;margin-bottom:10px}
.mrow p{margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{width:auto;min-height:44px;padding:8px 12px;font-size:15px;text-align:center}
.ord{list-style:none;margin:0;padding:0}
.ord li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:8px}
.ord .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.ord .t{flex:1;font-weight:700}
.ord button{width:44px;height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:18px;cursor:pointer;color:var(--ink)}
.ord button:disabled{opacity:.3}
.frow{margin-bottom:12px}.frow label{display:block;font-weight:700;margin-bottom:6px}
.frow input{width:100%;min-height:52px;font-size:20px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
table.t{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:14px;background:#fff}
table.t th,table.t td{border:1px solid var(--grey);padding:6px 8px;text-align:left}table.t th{background:var(--ink);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--grey);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:640px;margin:0 auto;display:flex;gap:8px}.nav .grow{flex:1}.nav[hidden]{display:none}
.tile{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:64px;font-size:16px;color:var(--ink)}
.tile:hover{border-color:var(--ink)}
.tile .no{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.tile b{display:block}.tile small{color:var(--muted);font-size:13px}
.tile .st{font-size:13px;font-weight:700}.tile.done .no{background:var(--green)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}.field label{font-weight:700;font-size:14px}
.field input{min-height:52px;font-size:18px;padding:0 12px;border:2px solid var(--line);border-radius:12px;width:100%}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:22px 18px;text-align:center}.hero .eyebrow{color:#d9d9d9}
.score{font-size:64px;font-weight:700;line-height:1}.score span{font-size:28px;font-weight:400;color:#d9d9d9}
.hero p{margin:10px 0 0;font-size:17px}
.seg{display:flex;gap:6px;margin:18px 0 10px}
.seg button{flex:1;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid transparent}
.row.ok{background:var(--ok-bg);border-color:#b9dfce}.row.ko{background:var(--ko-bg);border-color:#f3c3bc}
.mark{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
.ok .mark{background:var(--green)}.ko .mark{background:var(--red)}
.rname{font-weight:700}.rsol,.rmine{font-size:14px;margin-top:3px}.rmine{color:#B00F00}.rsol{color:#00694a}
.rnote{margin:8px 0 0;padding:8px 10px;background:#fff;border-radius:8px;font-size:13px;color:#333}
.bars .brow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:12px 0;font-size:14px}
.brow .bb{grid-column:1/-1;height:8px;background:var(--grey);border-radius:99px;overflow:hidden}.brow .bb span{display:block;height:100%;background:var(--green)}
.brow .bb.low span{background:var(--red)}
dialog{border:0;border-radius:18px;padding:0;width:calc(100% - 24px);max-width:600px;max-height:88vh;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;overflow:auto;max-height:88vh}.dlg h2{margin-bottom:10px}
.dlg .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.dlg .actions .btn{flex:1;min-width:130px}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.cell.done{background:var(--ink);border-color:var(--ink);color:#fff}.cell.cur{outline:3px solid var(--blue);outline-offset:1px}
.legend{font-size:13px;color:var(--muted);margin:10px 0 0}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:#fff3cd;color:#5c4400}
.small{font-size:13px;color:var(--muted)}
.gt{display:grid;gap:4px 0;margin:0 0 14px;background:#fff;border:1px solid var(--grey);border-radius:10px;padding:8px;align-items:center}
.gt .gw{font-size:11px;color:var(--muted);text-align:center;border-left:1px solid var(--grey)}
.gt .gl{font-size:13px;font-weight:700;grid-column:1}
.gt .gbar{height:20px;background:var(--blue);border-radius:4px;margin:0 1px}
.sigle{margin-top:14px;padding:10px 12px;background:#fff;border-radius:10px;font-size:13px;color:#333;border:1px solid var(--grey)}.sigle ul{margin:4px 0 0;padding-left:18px}
a.lnk{color:var(--blue);font-weight:700;background:none;border:0;padding:0;cursor:pointer;font-size:inherit;text-decoration:underline}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">Project Management base<small id="sub">Test in itinere</small></div><button class="btn small" id="hbtn" hidden>Elenco test</button></div></header>
<main id="app" aria-live="polite"></main>
<div class="nav" id="nav" hidden><div class="nav-in" id="navin"></div></div>
<dialog id="dlg"><div class="dlg" id="dlgin"></div></dialog>
<script>
/*CONFIG*/
const CONFIG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbwqkz7-Y_wKe6jHYf6k5mWEiPeeZAmrx9l_e-jwmtdeuOHP_piZnNzBZFrkSx3SYtf7/exec',            // indirizzo del servizio che raccoglie le risposte (vuoto = modalità prova, dati solo su questo dispositivo)
  statsKey: 'docente',     // chiave per la pagina statistiche (in modalità prova); con un servizio la verifica la fa il servizio
  appVersion: 1
};
/*DATA*/
const TESTS = [{"key":"T1","title":"Che cos'è un progetto","modulo":"Modulo 1","durata":"7-8 minuti","q":[{"id":"T1-01","t":"match","text":"Per ciascuna attività scegli: Progetto, Processo, Compito oppure «Dipende – informazioni insufficienti».","why":"Il nome non conta e nemmeno la novità del risultato: contano temporaneità, unicità, complessità e il fatto che lo faccia un team ad hoc o una struttura stabile. Del sito web non sappiamo né la complessità né chi lo fa: il PM non etichetta a sensazione, chiede.","src":"Mod. 1 sl. 10-11; Es. 1.1","items":["Emissione mensile delle fatture ai clienti","Costruzione di una nuova sede commerciale a Bologna: 120 persone di quattro funzioni da trasferire, budget e data di apertura assegnati, team dedicato per 14 mesi","Prenotare la sala per la riunione di giovedì","Gestione quotidiana del servizio clienti","Lancio di una nuova offerta commerciale con un team temporaneo di Marketing, IT, Legale e Vendite, budget e data di lancio definiti","Aggiornamento del sito web aziendale"],"cats":["Progetto","Processo","Compito","Dipende – informazioni insufficienti"],"a":[1,0,2,1,0,3]},{"id":"T1-02","t":"single","text":"Quale tra queste NON è una caratteristica distintiva di un progetto?","why":"Il lavoro ripetitivo e continuativo svolto da una struttura permanente è la definizione di processo («business as usual»).","src":"Mod. 1 sl. 11","opts":["Risultato unico","Organizzazione specifica ma temporanea","Svolgimento ripetitivo e continuativo da parte di una struttura stabile","Vincoli di tempo e di costo"],"a":2},{"id":"T1-03","t":"single","text":"«Un'attività che produce un risultato nuovo è sempre un progetto.» Qual è la risposta giusta?","why":"Se l'ufficio R&S di un'azienda sviluppa ogni anno nuovi modelli lavora per processo, anche se ogni modello è nuovo. Si distingue cosa si produce (qualcosa di nuovo) da come lo si produce (per processo o per progetto).","src":"Es. 1.1 (la «trappola» dell'attività 11)","opts":["Vero: se il risultato è nuovo, è un progetto","Falso: conta se lo produce in modo continuativo una struttura stabile oppure un team temporaneo e interfunzionale costituito ad hoc","Falso: i progetti non producono mai risultati nuovi","Falso: solo le iniziative sotto i tre anni sono progetti"],"a":1},{"id":"T1-04","t":"single","text":"«Temporaneo» significa di breve durata e si applica anche al risultato che il progetto crea.","why":"Temporaneo vuol dire con un inizio e una fine definiti, non necessariamente breve. Non riguarda il risultato: la maggior parte dei progetti crea risultati durevoli (una sede, un impianto, un sistema).","src":"Mod. 1 sl. 9, note","fixed":true,"opts":["Vero","Falso"],"a":1},{"id":"T1-06","t":"multi","text":"Quali sono i quattro tratti distintivi indicati nella slide «Che cos'è un progetto»?","why":"Gli obiettivi impliciti nella struttura e la ripetizione sono tratti dell'attività corrente, non del progetto, dove gli obiettivi sono invece chiari ed espliciti.","src":"Mod. 1 sl. 10, note","opts":["Insieme di attività complesse e interrelate","Risultato unitario e specifico","Obiettivi impliciti nella struttura organizzativa","Tempo predefinito e limitato","Ciclicità e ripetizione delle attività","Utilizzo di un insieme di risorse"],"a":[0,1,3,5]},{"id":"T1-07","t":"single","text":"Il reparto IT sta migrando i dati dei clienti su una nuova piattaforma. Non sono stati fissati né una data di fine né un budget: «si va avanti finché serve». Dopo 18 mesi il team è ancora al lavoro e i requisiti continuano a crescere. Quale lettura è corretta?","why":"I limiti di tempo e di costo servono proprio perché un progetto, per definizione, deve avere un inizio e una fine. Se il committente non li dà (come in certi progetti di ricerca e sviluppo) li definisce il team con la pianificazione. La durata lunga e i requisiti che evolvono non trasformano un progetto in un processo.","src":"Mod. 1 sl. 9-11, note","opts":["È un processo, perché dura molto e continua nel tempo","Ha un risultato unico ma gli mancano i vincoli di tempo e costo: senza una fine e un budget definiti rischia di non concludersi mai, come la «fabbrica del Duomo». Va fissato un limite, anche dal team con la pianificazione se il committente non lo dà","È un progetto ben avviato: i vincoli di tempo e costo non sono tratti distintivi del progetto","Non è un progetto perché i requisiti cambiano: un progetto ha requisiti fissi per tutta la durata"],"a":1},{"id":"T1-08","t":"multi","text":"L'ufficio Ricerca e Sviluppo di un'azienda, struttura stabile, sviluppa ogni anno nuovi modelli a catalogo e chiama «Progetto Modello 2027» l'ultimo sviluppo. Per decidere se è davvero un progetto, quali informazioni ti servono? Seleziona le tre che contano.","why":"Il nome non rende progetto un'attività, e nemmeno l'output nuovo o la durata. Contano il modo di lavorare (struttura permanente e continuativa contro team temporaneo costituito per l'occasione), i vincoli definiti e l'interrelazione delle attività tra funzioni.","src":"Mod. 1 sl. 10-11; Es. 1.1","opts":["Se lo svolge la struttura stabile come attività ordinaria oppure un team temporaneo costituito ad hoc","Se ha un inizio e una fine definiti, con obiettivi, tempi e budget assegnati","Se coinvolge più funzioni con compiti interrelati","Se nel nome compare la parola «Progetto»","Se il risultato è diverso da quello dello scorso anno","Se dura più di un anno"],"a":[0,1,2]}]},{"key":"T2","title":"Competenze del Project Manager","modulo":"Modulo 2","durata":"5-6 minuti","q":[{"id":"T2-01","t":"match","text":"Per ciascuna frase scegli la competenza chiave del Project Manager a cui si riferisce.","why":"Sono le quattro competenze chiave che fanno da filo conduttore ai moduli successivi: guidare e motivare le persone, pianificare, organizzare, controllare.","src":"Mod. 2 sl. 6","items":["Far sì che le persone diano il massimo e realizzino una prestazione eccellente","Stabilire come si raggiungeranno i risultati del progetto","Trovare l'equilibrio operativo tra obiettivi, risorse e vincoli","Verificare a che punto è il progetto e intervenire in tempo con le correzioni necessarie"],"cats":["Guidare – motivare","Pianificare","Organizzare","Controllare"],"a":[0,1,2,3]},{"id":"T2-02","t":"single","text":"Quale frase definisce il Project Manager (e non il Project Management)?","why":"La prima frase definisce il Project Management (insieme di conoscenze e tecniche), la terza il project charter, la quarta il PMO.","src":"Mod. 2 sl. 3","opts":["Applicazione di conoscenze, competenze, strumenti e tecniche alle attività di progetto per soddisfarne i requisiti","Persona incaricata del raggiungimento degli obiettivi di progetto","Documento che autorizza formalmente l'esistenza del progetto","Ufficio che coordina tutti i progetti dell'azienda"],"a":1},{"id":"T2-03","t":"single","text":"Il committente chiede di anticipare del 30% la consegna senza aggiungere risorse e senza ridurre il perimetro. Che cosa è più probabile, nella logica della triade risultati–tempo–risorse?","why":"Tempo, risorse e risultati sono legati: se ne comprimi uno senza agire sugli altri, paga il terzo. Il PM serve a bilanciarli.","src":"Mod. 2 sl. 2","opts":["Nulla: basta lavorare meglio","Un compromesso sul risultato (qualità o perimetro) oppure un forte rischio di non rispettare i tempi","Una riduzione automatica dei costi","Un aumento automatico delle risorse"],"a":1},{"id":"T2-04","t":"multi","text":"Se siamo responsabili di un progetto, di quali capacità abbiamo bisogno? Seleziona quelle corrette.","why":"Il Project Manager non è il tecnico più bravo né il custode di un piano immutabile, e non decide da solo su ciò che riguarda committente e sponsor: tiene insieme persone, tempi, rischi e accordi.","src":"Mod. 2, soluzione Es. 2.2","opts":["Gestire e motivare le persone del team","Comunicare e negoziare con committente, sponsor e fornitori","Valutare persone, costi, investimenti e rischi","Conoscere ogni attività tecnica meglio di chiunque nel team, per poterne verificare personalmente la qualità","Difendere il piano iniziale senza modifiche, per dare stabilità al team","Decidere da soli sulle questioni di budget, per essere più rapidi"],"a":[0,1,2]},{"id":"T2-05","t":"match","text":"A quale competenza chiave corrisponde ciascuna situazione?","why":"Le competenze si intrecciano nella pratica, ma ciascuna ha un baricentro riconoscibile: pianificare è decidere come arrivare al risultato, organizzare è trovare l'equilibrio tra obiettivi, risorse e vincoli, controllare è misurare e correggere in tempo, guidare è far rendere le persone.","src":"Mod. 2 sl. 6","items":["Scompone il lavoro, stima durate e costi e definisce la sequenza delle attività per stabilire come arrivare al risultato","Si accorge che gli obiettivi richiesti non sono raggiungibili con le risorse e i vincoli disponibili e negozia un equilibrio: riduce il perimetro oppure chiede più risorse","Ogni settimana confronta l'avanzamento reale con il piano e, vedendo uno scarto, adotta una misura correttiva","Riconosce il contributo di ciascuno e coinvolge il team nelle decisioni per mantenere alta la prestazione"],"cats":["Guidare – motivare","Pianificare","Organizzare","Controllare"],"a":[1,2,3,0]},{"id":"T2-06","t":"single","text":"Secondo il corso, il successo di un progetto significa…","why":"Il successo non è solo «consegnare»: gestire questo equilibrio è il mestiere del PM.","src":"Mod. 1 sl. 14","opts":["Consegnare nei tempi, qualunque sia il resto","Bilanciare qualità, tempi, costi e soddisfazione del committente","Spendere meno del budget","Chiudere il progetto prima possibile"],"a":1}]},{"key":"T3","title":"Ciclo di vita e controllo","modulo":"Modulo 3","durata":"10-12 minuti","q":[{"id":"T3-01","t":"order","text":"Metti in ordine le fasi del ciclo di vita del progetto.","why":"Il controllo non è una fase a sé: corre in parallelo a partire dall'esecuzione.","src":"Mod. 3 sl. 3","items":["Ideazione e avviamento","Definizione e pianificazione","Esecuzione","Completamento"]},{"id":"T3-02","t":"match","text":"In quale fase viene prodotto ciascun deliverable?","why":"Ogni fase ha i suoi deliverable chiave: è la logica che struttura tutto il modulo.","src":"Mod. 3 sl. 4-7","items":["Project charter","Mappa degli stakeholder","Work Breakdown Structure","Mappa dei rischi","Stato di avanzamento lavori","Analisi ex post e lessons learned"],"cats":["Ideazione e avviamento","Definizione e pianificazione","Esecuzione","Completamento"],"a":[0,0,1,1,2,3]},{"id":"T3-03","t":"single","text":"In quale fase si decide SE realizzare il progetto?","why":"Nell'ideazione si decide se fare il progetto; nella definizione si decide come farlo.","src":"Mod. 3 sl. 4-5, note","fixed":true,"opts":["Ideazione e avviamento","Definizione e pianificazione","Esecuzione","Completamento"],"a":0},{"id":"T3-04","t":"single","text":"«Un progetto abbandonato dopo la valutazione preliminare è un fallimento della gestione.»","why":"Molti progetti «muoiono» correttamente nell'ideazione: nelle gare d'appalto ogni concorrente avvia un proprio mini-progetto di valutazione, ma ne viene scelto uno solo. Saper fermarsi in tempo fa parte del valore della fase.","src":"Mod. 3 sl. 9-10, note","fixed":true,"opts":["Vero","Falso"],"a":1},{"id":"T3-05","t":"single","text":"Che cos'è il project charter?","why":"È la «carta d'identità del progetto» e il ponte tra ideazione e pianificazione. Si pensi alla carta con cui i sovrani di Spagna misero a disposizione di Colombo navi e uomini.","src":"Mod. 3 sl. 15-16","opts":["La scomposizione del lavoro in work package","Il documento che autorizza formalmente il progetto e dà mandato e autorità al Project Manager","Il verbale della riunione di avvio con il team","Il piano dettagliato dei costi"],"a":1},{"id":"T3-07","t":"single","text":"Qual è lo scopo del kick-off meeting?","why":"Il kick-off è il momento formale di avvio con il team; la decisione se fare il progetto è stata presa prima, nell'ideazione.","src":"Mod. 3 sl. 20, note","opts":["Decidere se avviare o no il progetto","Avviare formalmente il lavoro con il team, allineando obiettivi, ruoli e regole di ingaggio","Calcolare il percorso critico","Fare il consuntivo del progetto"],"a":1},{"id":"T3-08","t":"order","text":"Metti in ordine il ciclo di monitoraggio e controllo.","why":"Si parte dalla misura dell'avanzamento reale rispetto al piano, si valuta lo scostamento e se ne prevedono gli effetti, si agisce con le correzioni e si ripianifica.","src":"Mod. 6 sl. 25","items":["Misurare l'avanzamento reale e confrontarlo con il piano","Valutare lo scostamento e prevederne le conseguenze","Agire con le misure correttive","Ripianificare"]},{"id":"T3-09","t":"multi","text":"Quali attività appartengono alla fase di chiusura?","why":"La chiusura è spesso la fase trascurata: ma senza analisi ex post non si capisce quanto fossero giuste le stime e gli errori si ripetono nei progetti successivi.","src":"Mod. 3 sl. 7; Mod. 6 sl. 25","opts":["Consegna del risultato agli utilizzatori","Test e avviamento","Raccolta dei requisiti","Analisi ex post, lessons learned e aggiornamento degli archivi","Scomposizione del progetto in WBS"],"a":[0,1,3]}]},{"key":"T4","title":"Gli stakeholder","modulo":"Modulo 3","durata":"8-10 minuti","q":[{"id":"T4-01","t":"single","text":"Un'azienda trasferisce un servizio in una nuova sede. Un'associazione di quartiere non ha alcun ruolo nel progetto né potere di decisione, ma teme l'aumento del traffico. È uno stakeholder?","why":"La definizione è ampia: stakeholder è chi può influenzare, essere influenzato o percepirsi interessato da una decisione, attività o risultato del progetto. Comprende anche chi subisce le conseguenze, senza ruolo formale.","src":"Mod. 3 sl. 22","opts":["No: non partecipa al progetto e non decide","Sì: può essere influenzata dal progetto o percepirsi interessata dai suoi effetti, anche senza ruolo formale","Sì, ma solo se ha il potere di bloccare le autorizzazioni","Solo se presenta un reclamo formale"],"a":1},{"id":"T4-02","t":"single","text":"Chi finanzia il progetto, lo promuove all'interno dell'organizzazione, incarica formalmente il PM con il project charter ed è il riferimento per l'escalation?","why":"Lo sponsor non coincide con il committente: finanzia, dice che cosa vuole, fa da portavoce ai livelli superiori e autorizza le modifiche di ambito e le decisioni go/no go.","src":"Mod. 3 sl. 22, note","opts":["Il cliente finale","Lo sponsor","L'ufficio aziendale che coordina e supporta tutti i progetti (PMO)","Il fornitore principale"],"a":1},{"id":"T4-03","t":"match","text":"Una catena di supermercati introduce le casse automatiche in 40 punti vendita. Colloca ciascun soggetto nel quadrante. Interesse = quanto il progetto incide sul suo ambito; potere = quanto può incidere su impostazione, esecuzione e risultati.","why":"Interesse = quanto il progetto incide sull'ambito dello stakeholder. Potere = quanto lo stakeholder può incidere su impostazione, esecuzione e risultati.","src":"Mod. 3 sl. 24, note","items":["Il direttore generale, che finanzia e promuove il progetto","I cassieri, il cui lavoro cambierà","L'ente di controllo che deve autorizzare gli apparecchi ma segue poco il progetto","I residenti del quartiere che non frequentano il negozio"],"cats":["Chiave","Istituzionale","Operativo","Marginale"],"a":[0,2,1,3]},{"id":"T4-04","t":"match","text":"Abbina ogni modo di comunicare al quadrante degli stakeholder a cui conviene.","why":"La strategia segue il quadrante: chi ha potere e interesse si gestisce da vicino; chi ha potere ma poco interesse va tenuto soddisfatto per evitare sorprese; chi ha interesse ma poco potere va ascoltato; chi ha poco di entrambi va semplicemente tenuto informato.","src":"Mod. 3 sl. 26","items":["Coinvolgerlo nelle decisioni e aggiornarlo con frequenza","Rispettarne il ruolo e prevenire le sorprese, con contatti mirati e puntuali","Raccogliere con regolarità le sue osservazioni, perché vive il progetto ogni giorno","Comunicazioni periodiche essenziali, senza assorbire energie"],"cats":["Chiave","Istituzionale","Operativo","Marginale"],"a":[0,1,2,3]},{"id":"T4-05","t":"single","text":"Un comitato di residenti contrari ha poco potere formale. Perché non va comunque trascurato?","why":"Potere formale basso non significa capacità di influenza bassa. Va ascoltato in modo strutturato, con incontri e misure di mitigazione.","src":"Mod. 3 / Caso 3.1, soluzione","opts":["Perché i residenti hanno sempre ragione","Perché può ritardare i lavori agendo su autorità locali e opinione pubblica","Perché è obbligatorio per legge invitarli al kick-off","Perché finanzia il progetto"],"a":1},{"id":"T4-06","t":"single","text":"«L'identificazione degli stakeholder si fa una volta sola, in avvio di progetto.»","why":"È un processo continuo lungo l'intero ciclo di vita: livelli di responsabilità e autorità cambiano nel tempo e accorgersi tardi di uno stakeholder importante (per esempio l'ufficio legale) causa ritardi e costi.","src":"Mod. 3 sl. 22, note","fixed":true,"opts":["Vero","Falso"],"a":1},{"id":"T4-07","t":"multi","text":"Quali tra queste sono tecniche di identificazione degli stakeholder indicate nel modulo?","why":"Matrice di carico e Gantt sono strumenti di pianificazione, non di identificazione.","src":"Mod. 3 sl. 24","opts":["Brainstorming","Check list","Rappresentazione (ricostruire in modo simulato l'ambiente di progetto)","Matrice di carico","Diagramma di Gantt"],"a":[0,1,2]},{"id":"T4-08","t":"single","text":"Nel progetto delle casse automatiche i cassieri non sono i destinatari finali (i clienti dei supermercati), ma la loro collaborazione condiziona il risultato. Che cosa implica per la mappatura degli stakeholder?","why":"Serve una mappatura precisa dei destinatari a più livelli: spesso si analizza solo il cliente finale e si trascura chi dovrà far funzionare la soluzione. I cassieri hanno alto interesse e potere limitato sulle decisioni, ma molto sull'adozione: vanno ascoltati.","src":"Mod. 3 sl. 22, note","opts":["Vanno mappati come gruppo distinto dai consumatori, con bisogni e strategia propri, perché l'adozione dipende dal loro atteggiamento","Basta mappare i consumatori: i cassieri seguiranno le indicazioni dell'azienda","Vanno considerati stakeholder marginali, perché non pagano il progetto né ne decidono l'impostazione","Conviene unire cassieri e consumatori in un unico gruppo «utenti», per semplificare la mappa"],"a":0}]},{"key":"T5","title":"PBS e WBS","modulo":"Modulo 4","durata":"12-15 minuti","q":[{"id":"T5-01","t":"match","text":"Nel progetto «Nuova linea ferroviaria locale» ciascuna voce è un deliverable (PBS) oppure un'attività (WBS)?","why":"Il deliverable è ciò che si consegna e si fa accettare, e si esprime con un sostantivo; l'attività è ciò che si fa per ottenerlo, e si esprime con un verbo all'infinito.","src":"Mod. 4 sl. 8-12","items":["Manuale di manutenzione","Redigere il manuale di manutenzione","Verbale di collaudo","Collaudare la linea","Autorizzazione alla messa in servizio","Ottenere l'autorizzazione alla messa in servizio"],"cats":["Deliverable (PBS)","Attività (WBS)"],"a":[0,1,0,1,0,1]},{"id":"T5-02","t":"single","text":"Qual è la differenza fra PBS e WBS?","why":"Prima si definisce che cosa ottenere (sostantivi), poi come ottenerlo (verbi). Da ogni foglia della PBS discendono le attività della WBS.","src":"Mod. 4 sl. 8-9","opts":["Nessuna, sono sinonimi","La PBS scompone i risultati da consegnare (che cosa), la WBS scompone il lavoro da svolgere (come)","La PBS riguarda i costi, la WBS i tempi","La PBS è per i progetti IT, la WBS per tutti gli altri"],"a":1},{"id":"T5-03","t":"multi","text":"Ecco la WBS (abbozzo) del progetto «Blog aziendale per le scuole medie». Seleziona le tre voci da correggere.","why":"La WBS aggrega per prodotto, non per responsabilità (per quello c'è la RAM). I livelli dei deliverable hanno nomi, le attività verbi all'infinito, e nulla si genera né si disperde passando da un livello all'altro. Attenzione: scomporre per fasi non è sempre consigliabile, perché si finisce per ricalcare il calendario invece del prodotto; di norma conviene partire dai deliverable.","src":"Mod. 4 sl. 11-12, note","fixed":true,"opts":["1  Piattaforma del blog","2  Contenuti editoriali","2.1  Pianificare il calendario editoriale","2.2  Pubblicare i contenuti","3  Attività dell'ufficio Marketing","3.1  Pubblicare i contenuti","3.2  Promuovere il blog sui social","4  Sviluppare la grafica","5  Project Management"],"a":[4,5,7]},{"id":"T5-04","t":"single","text":"Un collega presenta la WBS del progetto «Blog aziendale»: contiene tutte le attività tecniche (piattaforma, contenuti, grafica, promozione) e la considera completa. Che obiezione fai?","why":"La WBS deve contenere tutto il lavoro necessario: oltre ai rami dei deliverable servono, al primo livello, le attività di integrazione e di Project Management, altrimenti il progetto è incompleto. Costi e date non fanno parte della WBS: arrivano dopo, con la pianificazione.","src":"Mod. 4 sl. 11-12, note","opts":["Nessuna: la WBS contiene il lavoro tecnico, che è quello che produce i risultati","Mancano le attività indirette, come il coordinamento, l'integrazione e la gestione del progetto: la WBS deve coprire il 100% del lavoro, non solo quello tecnico","Manca l'elenco dei costi di ogni attività","Mancano le date di inizio e di fine di ogni attività"],"a":1},{"id":"T5-05","t":"single","text":"«Un'attività che non compare nella WBS può essere comunque assegnata, contabilizzata e pianificata.»","why":"Metodologicamente le attività non riportate nella WBS non possono essere né assegnate, né contabilizzate, né pianificate: la WBS è il «linguaggio ufficiale» del progetto (la Stele di Rosetta).","src":"Mod. 4 sl. 11, note","fixed":true,"opts":["Vero","Falso"],"a":1},{"id":"T5-06","t":"single","text":"Fino a che punto si scompone una WBS?","why":"Non esiste un livello ideale in assoluto: se la WBS non «tiene» quando la si usa per assegnare responsabilità, costi e tempi, si torna indietro e la si affina.","src":"Mod. 4 sl. 11-13, note","opts":["Sempre fino al sesto livello","Fino a che il livello consente di assegnare responsabilità, costi e tempi e di controllare il lavoro (come regola euristica, attività tra 4 e 40 ore)","Fino a singole azioni di un'ora","Fino al dettaglio di ogni singolo componente fisico dell'opera"],"a":1},{"id":"T5-07","t":"single","text":"Quale coppia di denominazioni rispetta le regole della WBS?","why":"I livelli dei deliverable sono sostantivi che dicono che cosa si consegna; le attività sono verbi all'infinito che dicono che cosa si fa.","src":"Mod. 4 sl. 11, note (denominazione)","opts":["Deliverable: «Sviluppare il software» · Attività: «Specifiche funzionali»","Deliverable: «Software applicativo» · Attività: «Redigere le specifiche funzionali»","Deliverable: «Software» · Attività: «Software»","Deliverable: «Fase di sviluppo» · Attività: «Sviluppo»"],"a":1},{"id":"T5-08","t":"single","text":"«Nella WBS sono rappresentate le dipendenze tra gli elementi.»","why":"La WBS dice di che cosa è fatto il progetto, non in che ordine. La sequenza si costruisce più avanti con il reticolo logico.","src":"Mod. 4 sl. 12, note","fixed":true,"opts":["Vero","Falso"],"a":1},{"id":"T5-09","t":"order","text":"Metti in ordine i passi della pianificazione.","why":"Prima si definisce che cosa consegnare (PBS), poi il lavoro da fare (WBS); si stimano le durate, si definisce la sequenza delle attività (reticolo) e si calcola il Gantt, che porta il piano sul calendario. Nella pratica si torna spesso indietro.","src":"Mod. 4 sl. 5; Mod. 6","items":["PBS","WBS","Stima delle durate","Reticolo logico","Gantt"]},{"id":"T5-10","t":"match","text":"Due gruppi costruiscono la WBS dello stesso progetto con metodi diversi. Abbina ogni gruppo al metodo che sta usando.","why":"Nel metodo top-down si parte dall'alto (i deliverable) e si scende fino alle attività. Nel bottom-up si parte dal basso: si elencano deliverable e attività in ordine sparso, si eliminano i duplicati, si aggregano per classi e si ordinano in livelli. Sono due metodi validi: contano completezza e coerenza.","src":"Mod. 4 sl. 14","items":["Il gruppo parte dai deliverable (manuale, piattaforma, grafica) e li scompone, livello dopo livello, nelle attività necessarie","Il gruppo scrive su dei post-it tutte le attività che gli vengono in mente, poi elimina i doppioni e li raggruppa sotto i deliverable"],"cats":["Top-down","Bottom-up"],"a":[0,1]}]},{"key":"T6","title":"OBS, RAM e RACI","modulo":"Modulo 5","durata":"8-10 minuti","q":[{"id":"T6-01","t":"single","text":"Che cosa scompone l'OBS (Organization Breakdown Structure)?","why":"La WBS scompone il cosa (deliverable e attività), l'OBS il chi (unità organizzative): sono i due assi da cui nascono le matrici delle responsabilità.","src":"Mod. 5 sl. 3","opts":["I deliverable di progetto","Le attività di progetto","Le responsabilità di progetto: chi risponde di che cosa e chi riporta a chi","I costi di progetto"],"a":2},{"id":"T6-02","t":"single","text":"Dall'incrocio di che cosa nascono le matrici RAM e RACI?","why":"Si mettono in relazione i compiti definiti nella WBS con le unità organizzative responsabili.","src":"Mod. 5 sl. 4","opts":["Attività della WBS (righe) e ruoli o unità dell'OBS (colonne)","Costi e tempi","Deliverable e rischi","Fasi e stakeholder"],"a":0},{"id":"T6-03","t":"match","text":"Abbina ogni significato alla lettera della RACI.","why":"Il passaggio chiave è la differenza fra chi esegue e chi risponde del lavoro.","src":"Mod. 5 sl. 6","items":["svolge materialmente il lavoro","risponde del risultato (uno solo per attività)","fornisce pareri prima della decisione","è tenuto al corrente dell'esito"],"cats":["R","A","C","I"],"a":[0,1,2,3]},{"id":"T6-04","t":"single","text":"Qual è la differenza fra RAM e RACI?","why":"Sono due livelli di dettaglio dello stesso strumento: la RAM è una semplice matrice a X con codici WBS, la RACI usa le lettere R/A/C/I con una legenda.","src":"Mod. 5 sl. 4-6","opts":["La RAM indica solo chi partecipa a ciascuna attività; la RACI specifica con quale tipo di responsabilità","La RAM è per le attività, la RACI per i costi","La RAM riguarda i fornitori, la RACI i clienti","Nessuna"],"a":0},{"id":"T6-05","t":"multi","text":"Nella RACI qui sotto (R esegue, A risponde del risultato, C è consultato, I è informato) alcune attività hanno un errore. Ricorda le due regole: per ogni attività c'è un solo A e almeno un R. Seleziona le attività da correggere.","why":"Collaudo ha due Accountable (PM e Tester) e nessun Responsible; Rilascio in esercizio non ha nessun Accountable. Documentazione è corretta: più R sulla stessa attività sono ammessi, più A no.","src":"Mod. 5 sl. 6","fixed":true,"table":{"head":["Attività","PM","Analista","Sviluppatore","Tester"],"rows":[["Raccolta requisiti","A","R","I","—"],["Sviluppo","A","C","R","I"],["Collaudo","A","I","C","A"],["Rilascio in esercizio","—","R","R","I"],["Documentazione","A","R","R","C"]]},"opts":["Raccolta requisiti","Sviluppo","Collaudo","Rilascio in esercizio","Documentazione"],"a":[2,3]},{"id":"T6-06","t":"single","text":"«In una RACI, per ogni attività può esserci più di un Responsible, ma un solo Accountable.»","why":"Vedi la domanda precedente: l'unicità riguarda chi risponde del risultato, non chi esegue.","src":"Mod. 5 sl. 6","fixed":true,"opts":["Vero","Falso"],"a":0},{"id":"T6-07","t":"form","text":"Una squadra è composta da 3 persone. Ciascuna persona lavora 20 giorni sul progetto e produce 2 schede al giorno. Quante schede produce in totale la squadra?","why":"Capacità di produzione = produttività × tempo disponibile, e il tempo disponibile è il numero di persone per i giorni di ciascuna: 2 schede/giorno × (3 persone × 20 giorni) = 120 schede. È una stima di massima per un piano di massima.","src":"Mod. 5 sl. 7","fields":[{"l":"Schede prodotte in totale","k":"num","a":120}]},{"id":"T6-08","t":"single","text":"Secondo il modulo, da quali fattori dipende la produttività?","why":"Il numero di risorse e il tempo entrano nel calcolo del tempo disponibile, non della produttività.","src":"Mod. 5 sl. 7","opts":["Esperienza × motivazione × capacità","Budget × durata","Numero di riunioni × qualità dei verbali","Numero di risorse × tempo"],"a":0}]},{"key":"T7","title":"Stime, effort e matrice di carico","modulo":"Modulo 6","durata":"12-14 minuti","q":[{"id":"T7-01","t":"match","text":"Abbina il metodo di stima alla descrizione.","why":"Le due stime si usano in momenti diversi: all'inizio, quando le informazioni sono poche, e dopo la scomposizione.","src":"Mod. 6 sl. 6","items":["stima di massima iniziale per avere un ordine di grandezza, rapida ma poco accurata","stima specifica dopo la scomposizione in work package, più accurata ma più onerosa"],"cats":["Top-down","Bottom-up"],"a":[0,1]},{"id":"T7-02","t":"match","text":"Abbina la tecnica di stima alla sua logica.","why":"Spesso se ne usano diverse per parti diverse del progetto.","src":"Mod. 6 sl. 7","items":["confronto con progetti simili già completati","valori unitari × volumi di attività","giudizio di soggetti competenti","valore ottimistico, pessimistico e probabile"],"cats":["Analogia","Parametrica","Parere di esperti (anche Delphi)","Tre punti / PERT"],"a":[0,1,2,3]},{"id":"T7-03","t":"form","text":"Per un'attività le stime sono: ottimistica 10 giorni, probabile 14, pessimistica 30. Calcola il valore atteso con la formula PERT.","why":"(4 × probabile + ottimistico + pessimistico) / 6 = (56 + 10 + 30) / 6 = 16.","src":"Mod. 6 sl. 7 e 17","fields":[{"l":"Valore atteso (giorni)","k":"num","a":16}]},{"id":"T7-04","t":"single","text":"Con gli stessi dati la media semplice dei tre valori dà 18. Perché la PERT dà 16?","why":"La PERT è una media pesata: il valore probabile conta quattro volte più degli estremi, e questo la rende meno sensibile ai valori anomali.","src":"Mod. 6 sl. 7 e 17","opts":["Perché sottrae il valore pessimistico","Perché pesa quattro volte il valore più probabile","Perché ignora il valore ottimistico","Perché arrotonda per difetto"],"a":1},{"id":"T7-05","t":"form","text":"Un'attività richiede 30 giornate/uomo. Se la affidi a 3 persone a tempo pieno e il lavoro è divisibile, quanti giorni di calendario dura?","why":"L'effort misura la quantità di lavoro, la durata dipende anche da quante risorse lavorano: 30 / 3 = 10.","src":"Mod. 6 sl. 8-9, note","fields":[{"l":"Durata (giorni di calendario)","k":"num","a":10}]},{"id":"T7-06","t":"form","text":"Per la stessa attività da 30 giornate/uomo hai a disposizione due persone che possono dedicarci solo metà del loro tempo. Quanto dura?","why":"Due persone al 50% valgono una persona a tempo pieno: 30 / (2 × 0,5) = 30. Lo stesso effort può dare durate molto diverse.","src":"Mod. 6 sl. 8-9, note","fields":[{"l":"Durata (giorni)","k":"num","a":30}]},{"id":"T7-07","t":"form","text":"Leggi la matrice di carico (giornate/uomo) e rispondi.","why":"Il totale di riga dimensiona il work package, il totale di colonna mostra il carico di ciascuna risorsa e segnala possibili colli di bottiglia da riequilibrare.","src":"Mod. 6 sl. 8","table":{"head":["Attività","PM","Analista","Sviluppatore","Tester"],"rows":[["Analisi","1","6","0","0"],["Sviluppo","1","2","12","0"],["Test","1","1","3","8"],["Rilascio","2","0","2","3"]]},"fields":[{"l":"(a) Totale dell'attività «Sviluppo»","k":"num","a":15},{"l":"(b) Carico totale dello Sviluppatore","k":"num","a":17},{"l":"(c) Quale risorsa è più carica?","k":"pick","opts":["PM","Analista","Sviluppatore","Tester"],"a":2}]},{"id":"T7-08","t":"single","text":"Due attività che potrebbero svolgersi in parallelo richiedono la stessa persona. Passando da una pianificazione a risorse infinite a una a risorse finite, che cosa può accadere?","why":"Un limite alle risorse ha un riflesso sulla durata. Spesso si calcola prima il piano a risorse infinite e poi si introducono i limiti.","src":"Mod. 6 sl. 9","opts" function rnd4() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(n, seedStr, notIdentity) {
  const idx = [...Array(n).keys()], r = rng(hash(seedStr));
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  if (notIdentity && n > 1 && idx.every((v, i) => v === i)) [idx[0], idx[1]] = [idx[1], idx[0]];
  return idx;
}

const getA = (q) => (DB.answers[S.test] || {})[q.id];
function setA(q, v) { (DB.answers[S.test] = DB.answers[S.test] || {})[q.id] = v; saveDB(); }
function answered(q) {
  const a = getA(q);
  if (a === undefined || a === null) return false;
  if (q.t === 'single') return typeof a === 'number';
  if (q.t === 'multi') return a.length > 0;
  if (q.t === 'match') return a.every((x) => x !== null && x !== undefined);
  if (q.t === 'order') return true;
  if (q.t === 'form') return q.fields.every((f, i) => a[i] !== undefined && a[i] !== '' && a[i] !== null);
  return false;
}
const num = (s) => parseFloat(String(s).replace(',', '.').trim());
function check(q, a) {
  if (a === undefined || a === null) return { ok: 0, f: 0 };
  if (q.t === 'single') { const ok = a === q.a ? 1 : 0; return { ok, f: ok }; }
  if (q.t === 'multi') { const A = [...a].sort().join(), B = [...q.a].sort().join(); const ok = A === B ? 1 : 0; return { ok, f: ok }; }
  if (q.t === 'match') { const c = q.a.filter((x, i) => a[i] === x).length; return { ok: c === q.a.length ? 1 : 0, f: c / q.a.length }; }
  if (q.t === 'order') { const ord = a.length ? a : []; const c = ord.filter((x, i) => x === i).length; return { ok: c === q.items.length ? 1 : 0, f: c / q.items.length }; }
  if (q.t === 'form') {
    let c = 0;
    q.fields.forEach((f, i) => { const v = a[i]; if (f.k === 'num') { if (v !== undefined && v !== '' && Math.abs(num(v) - f.a) < 1e-9) c++; } else if (v === f.a) c++; });
    return { ok: c === q.fields.length ? 1 : 0, f: c / q.fields.length };
  }
  return { ok: 0, f: 0 };
}
function givenText(q, a) {
  if (a === undefined || a === null) return 'nessuna risposta';
  if (q.t === 'single') return typeof a === 'number' ? q.opts[a] : 'nessuna risposta';
  if (q.t === 'multi') return a.length ? [...a].sort((x, y) => x - y).map((i) => q.opts[i]).join(' · ') : 'nessuna selezione';
  if (q.t === 'match') return q.items.map((it, i) => it + ' → ' + (a[i] === null || a[i] === undefined ? '—' : q.cats[a[i]])).join(' · ');
  if (q.t === 'order') return a.map((i) => q.items[i]).join(' → ');
  if (q.t === 'form') return q.fields.map((f, i) => f.l + ': ' + (a[i] === undefined || a[i] === '' ? '—' : (f.k === 'pick' ? f.opts[a[i]] : a[i]))).join(' · ');
  return '';
}
function correctText(q) {
  if (q.t === 'single') return q.opts[q.a];
  if (q.t === 'multi') return q.a.map((i) => q.opts[i]).join(' · ');
  if (q.t === 'match') return q.items.map((it, i) => it + ' → ' + q.cats[q.a[i]]).join(' · ');
  if (q.t === 'order') return q.items.join(' → ');
  if (q.t === 'form') return q.fields.map((f) => f.l + ': ' + (f.k === 'pick' ? f.opts[f.a] : f.a)).join(' · ');
  return '';
}
function compact(q, a) {   // forma sintetica della risposta da inviare
  if (a === undefined || a === null) return '';
  if (q.t === 'single') return String(a);
  if (q.t === 'multi') return [...a].sort((x, y) => x - y).join(',');
  if (q.t === 'match') return a.map((x) => (x === null || x === undefined ? '-' : x)).join(',');
  if (q.t === 'order') return a.join(',');
  if (q.t === 'form') return a.map((x) => (x === undefined ? '' : String(x))).join('|');

const QKEY = 'pmt:queue', LKEY = () => 'pmt:local:' + S.edition;
function enqueue(payload) { const q = LS.get(QKEY, []); q.push(payload); LS.set(QKEY, q); }
async function flush() {
  const q = LS.get(QKEY, []);
  if (!q.length) return updStatus();
  if (!CONFIG.endpoint) { updStatus(); return; }
  const rest = [];
  for (const p of q) {
    try {
      const r = await fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
      const j = await r.json();
      if (!j || !j.ok) rest.push(p);
    } catch (e) { rest.push(p); }
  }
  LS.set(QKEY, rest); updStatus();
}
function updStatus() { const el = document.getElementById('sendstat'); if (!el) return; const n = LS.get(QKEY, []).length; el.textContent = CONFIG.endpoint ? (n ? n + ' test in attesa di invio: riprova più tardi con la connessione attiva.' : 'Risposte inviate.') : 'Modalità prova: le risposte restano su questo dispositivo.'; }
function submit() {
  const t = TESTS[S.test], ans = DB.answers[S.test] || {};
  const att = ((DB.done[S.test] || {}).attempt || 0) + 1;
  let score = 0; const rows = t.q.map((q) => { const c = check(q, ans[q.id]); score += c.ok; return { q: q.id, ok: c.ok, f: Math.round(c.f * 100) / 100, g: compact(q, ans[q.id]) }; });
  const payload = { v: CONFIG.appVersion, edition: S.edition, pid: S.pid, test: t.key, attempt: att, ts: new Date().toISOString(), score, n: t.q.length, answers: rows };
  DB.done[S.test] = { attempt: att, score, n: t.q.length, rows, answersSnap: JSON.parse(JSON.stringify(ans)) };
  saveDB();
  const loc = LS.get(LKEY(), []); loc.push(payload); LS.set(LKEY(), loc);   // copia locale, usata dalla pagina statistiche in modalità prova
  enqueue(payload); flush();
}

}
function tableHtml(tb) { return `<div style="overflow-x:auto"><table class="t"><thead><tr>${tb.head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
function corpus(q) { const a = [q.text]; (q.opts || []).forEach((x) => a.push(x)); (q.items || []).forEach((x) => a.push(x)); (q.cats || []).forEach((x) => a.push(x)); if (q.table) q.table.rows.concat([q.table.head]).forEach((r) => r.forEach((c) => a.push(c))); (q.fields || []).forEach((f) => { a.push(f.l); (f.opts || []).forEach((x) => a.push(x)); }); return a.join(' \n '); }
function sigleOf(q) { const c = corpus(q); return Object.keys(GLOSS).filter((k) => new RegExp('(^|[^A-Za-zÀ-ÿ0-9&])' + k.replace(/[&]/g, '\\&') + '($|[^A-Za-zÀ-ÿ0-9&])').test(c)); }
function sigleHtml(q) { const k = sigleOf(q); return k.length ? `<div class="sigle"><b>Sigle</b><ul>${k.map((x) => `<li><b>${esc(x)}</b>: ${esc(GLOSS[x])}</li>`).join('')}</ul></div>` : ''; }
function ganttHtml(g) {
  let h = `<div class="gt" role="img" aria-label="Diagramma di Gantt: ${g.rows.map((r) => r[0] + ' settimane ' + r[1] + (r[2] > r[1] ? ' a ' + r[2] : '')).join('; ')}" style="grid-template-columns:84px repeat(${g.weeks},1fr)"><span></span>`;
  for (let w = 1; w <= g.weeks; w++) h += `<span class="gw">S${w}</span>`;
  g.rows.forEach((r, i) => { h += `<span class="gl">${esc(r[0])}</span>` + `<span class="gbar" style="grid-column:${r[1] + 1} / ${r[2] + 2};grid-row:${i + 2}"></span>`; });
  return h + '</div>';
}
const TYPE_LABEL = { single: 'Una sola risposta', multi: 'Più risposte possibili', match: 'Abbinamento', order: 'Ordinamento', form: 'Calcolo e lettura' };
function vTest() {
  const t = TESTS[S.test], q = t.q[S.qi], n = t.q.length;
  $('#sub').textContent = t.title;
  let body = '';
  if (q.table && q.t !== 'form') body += tableHtml(q.table);
  if (q.gantt) body += ganttHtml(q.gantt);
  if (q.t === 'single') {
    const a = getA(q), p = perm(q, q.opts.length);
    body += `<div class="opts" role="radiogroup" aria-label="Risposte">${p.map((i) => `<button class="opt ${q.fixed && q.opts.length === 2 ? 'vf' : ''}" role="radio" aria-checked="${a === i}" data-i="${i}">${esc(q.opts[i])}</button>`).join('')}</div>`;
  } else if (q.t === 'multi') {
    const a = getA(q) || [], p = perm(q, q.opts.length);
    body += `<p class="hint">Seleziona tutte le risposte che ritieni corrette.</p><div class="opts">${p.map((i) => `<button class="opt" aria-pressed="${a.includes(i)}" data-i="${i}">${esc(q.opts[i])}</button>`).join('')}</div>`;
  } else if (q.t === 'match') {
    const a = getA(q) || q.items.map(() => null), p = shuffled(q.items.length, S.pid + q.id + 'm');
    body += p.map((k) => `<div class="mrow"><p>${esc(q.items[k])}</p><div class="chips" role="group" aria-label="${esc(q.items[k])}">${q.cats.map((c, ci) => `<button class="opt" aria-pressed="${a[k] === ci}" data-k="${k}" data-c="${ci}">${esc(c)}</button>`).join('')}</div></div>`).join('');
  } else if (q.t === 'order') {
    let a = getA(q); if (!a) { a = shuffled(q.items.length, S.pid + q.id + 'o', true); setA(q, a); }
    body += `<p class="hint">Usa le frecce per portare ogni voce nella posizione giusta.</p><ol class="ord">${a.map((v, pos) => `<li><span class="n">${pos + 1}</span><span class="t">${esc(q.items[v])}</span><button data-up="${pos}" aria-label="Sposta su" ${pos === 0 ? 'disabled' : ''}>▲</button><button data-dn="${pos}" aria-label="Sposta giù" ${pos === a.length - 1 ? 'disabled' : ''}>▼</button></li>`).join('')}</ol>`;
  } else if (q.t === 'form') {
    const a = getA(q) || [];
    if (q.table) body += tableHtml(q.table);
    body += q.fields.map((f, i) => f.k === 'num'
      ? `<div class="frow"><label for="f${i}">${esc(f.l)}</label><input id="f${i}" inputmode="decimal" autocomplete="off" value="${a[i] !== undefined ? esc(a[i]) : ''}" data-f="${i}"></div>`
      : `<div class="frow"><label>${esc(f.l)}</label><div class="chips" role="group">${f.opts.map((o, oi) => `<button class="opt" aria-pressed="${a[i] === oi}" data-f="${i}" data-o="${oi}">${esc(o)}</button>`).join('')}</div></div>`).join('');
  }
  $('#app').innerHTML = `<div class="progress"><span>Domanda <b>${S.qi + 1}</b> di ${n}</span><span>${esc(t.modulo)}</span></div>
  <div class="bar"><span style="width:${((S.qi + 1) / n) * 100}%"></span></div>
  <div class="item"><p class="qtype">${TYPE_LABEL[q.t]}</p><h1 class="qtext">${esc(q.text)}</h1>${body}${sigleHtml(q)}</div>`;
  const last = S.qi === n - 1;
  setNav(`<button class="btn" id="bk" ${S.qi === 0 ? 'disabled' : ''}>Indietro</button><button class="btn" id="lst">Elenco</button><button class="btn primary grow" id="fw">${last ? 'Consegna' : 'Avanti'}</button>`);
  $('#bk').onclick = () => { S.qi--; render(); };
  $('#lst').onclick = () => openMap();
  $('#fw').onclick = () => { if (last) confirmSubmit(); else { S.qi++; render(); } };
  bindQ(q);
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
function bindQ(q) {
  const A = document.querySelectorAll('#app .opt');
  if (q.t === 'single') A.forEach((b) => b.onclick = () => { setA(q, +b.dataset.i); keepScroll(() => { vTest(); }); });
  if (q.t === 'multi') A.forEach((b) => b.onclick = () => { const a = [...(getA(q) || [])], i = +b.dataset.i; const k = a.indexOf(i); if (k >= 0) a.splice(k, 1); else a.push(i); setA(q, a); keepScroll(() => vTest()); });
  if (q.t === 'match') A.forEach((b) => b.onclick = () => { const a = [...(getA(q) || q.items.map(() => null))]; const k = +b.dataset.k, c = +b.dataset.c; a[k] = a[k] === c ? null : c; setA(q, a); keepScroll(() => vTest()); });
  if (q.t === 'order') {
    document.querySelectorAll('[data-up],[data-dn]').forEach((b) => b.onclick = () => { const a = [...getA(q)]; const p = +(b.dataset.up ?? b.dataset.dn); const d = b.dataset.up !== undefined ? -1 : 1; [a[p], a[p + d]] = [a[p + d], a[p]]; setA(q, a); keepScroll(() => vTest()); });
  }
  if (q.t === 'form') {
    document.querySelectorAll('input[data-f]').forEach((inp) => inp.oninput = () => { const a = [...(getA(q) || [])]; a[+inp.dataset.f] = inp.value; setA(q, a); });
    A.forEach((b) => b.onclick = () => { const a = [...(getA(q) || [])]; a[+b.dataset.f] = +b.dataset.o; setA(q, a); keepScroll(() => vTest()); });
  }
}
function openMap() {
  const t = TESTS[S.test];
  $('#dlgin').innerHTML = `<h2>Elenco delle domande</h2><div class="map">${t.q.map((q, i) => `<button class="cell ${answered(q) ? 'done' : ''} ${i === S.qi ? 'cur' : ''}" data-i="${i}" aria-label="Domanda ${i + 1}${answered(q) ? ', risposta data' : ', senza risposta'}">${i + 1}</button>`).join('')}</div>
  <p class="legend">Scuro = risposta data. Puoi tornare su qualsiasi domanda prima di consegnare.</p><div class="actions"><button class="btn" id="cl">Chiudi</button></div>`;
  $('#dlg').showModal();
  $('#cl').onclick = () => $('#dlg').close();
  document.querySelectorAll('.cell').forEach((c) => c.onclick = () => { S.qi = +c.dataset.i; $('#dlg').close(); render(); });
}
function confirmSubmit() {
  const t = TESTS[S.test], miss = t.q.map((q, i) => answered(q) ? null : i + 1).filter(Boolean);
  $('#dlgin').innerHTML = `<h2>Consegni il test?</h2><p>${miss.length ? 'Non hai ancora risposto alle domande: ' + miss.join(', ') + '. Se consegni ora risulteranno sbagliate.' : 'Hai risposto a tutte le domande.'}</p><p class="small">Dopo la consegna vedrai la correzione commentata.</p>
  <div class="actions"><button class="btn" id="no">Torna al test</button><button class="btn primary" id="si">Consegna</button></div>`;
  $('#dlg').showModal();
  $('#no').onclick = () => $('#dlg').close();
  $('#si').onclick = () => { $('#dlg').close(); submit(); S.view = 'result'; S.filter = 'bad'; render(); };
}
function vResult() {
  const t = TESTS[S.test], d = DB.done[S.test], ans = d.answersSnap || {};
  $('#sub').textContent = t.title;
  const pct = d.score / d.n;
  const msg = pct >= .8 ? 'Ottimo: avete assimilato bene questo modulo.' : pct >= .5 ? 'Buon punto di partenza: rivedete le domande segnalate in rosso.' : 'Ci sono diversi punti da riprendere: ne parliamo in aula.';
  const rows = t.q.map((q, i) => ({ q, i, c: check(q, ans[q.id]) }));
  const shown = S.filter === 'bad' ? rows.filter((r) => !r.c.ok) : rows;
  $('#app').innerHTML = `<div class="hero"><p class="eyebrow">${esc(t.title)}</p><div class="score">${d.score}<span> / ${d.n}</span></div><p>${msg}</p></div>
  <div class="seg" role="group"><button aria-pressed="${S.filter === 'bad'}" data-f="bad">Da rivedere (${rows.filter((r) => !r.c.ok).length})</button><button aria-pressed="${S.filter === 'all'}" data-f="all">Tutte (${rows.length})</button></div>
  <ul class="list">${shown.map((r) => `<li class="row ${r.c.ok ? 'ok' : 'ko'}"><span class="mark">${r.c.ok ? '✓' : '✕'}</span><div><div class="rname">${r.i + 1}. ${esc(r.q.text)}</div>
    ${r.c.ok ? '' : `<div class="rmine">La tua risposta: ${esc(givenText(r.q, ans[r.q.id]))}</div>`}<div class="rsol">Risposta corretta: ${esc(correctText(r.q))}</div>
    <div class="rnote">${esc(r.q.why)}${r.q.src ? ' <span class="small">[' + esc(r.q.src) + ']</span>' : ''}</div></div></li>`).join('') || '<li class="row ok"><span class="mark">✓</span><div class="rname">Nessuna domanda da rivedere.</div></li>'}</ul>
  <p class="small" id="sendstat"></p>`;
  document.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { S.filter = b.dataset.f; keepScroll(() => vResult()); });
  setNav(`<button class="btn grow primary" id="hm">Torna all'elenco dei test</button>`);
  $('#hm').onclick = () => { S.view = 'home'; render(); };
  updStatus();
}
/* ---------- statistiche del docente ---------- */
function askKey() {
  $('#dlgin').innerHTML = `<h2>Statistiche del docente</h2><div class="field"><label for="kk">Chiave docente</label><input id="kk" type="password" autocomplete="off"></div><p class="small" id="kmsg"></p>
  <div class="actions"><button class="btn" id="kc">Annulla</button><button class="btn primary" id="ko">Apri</button></div>`;
  $('#dlg').showModal();
  $('#kc').onclick = () => $('#dlg').close();
  $('#ko').onclick = async () => { const k = $('#kk').value; $('#kmsg').textContent = 'Carico…'; const ok = await loadStats(k); if (ok) { $('#dlg').close(); S.view = 'stats'; render(); } else $('#kmsg').textContent = 'Chiave non valida o dati non raggiungibili.'; };
  $('#kk').onkeydown = (e) => { if (e.key === 'Enter') $('#ko').click(); };
}
let STATS = [];
async function loadStats(key) {
  if (!CONFIG.endpoint) { if (key !== CONFIG.statsKey) return false; STATS = LS.get(LKEY(), []); return true; }
  try { const r = await fetch(CONFIG.endpoint + '?action=stats&edition=' + encodeURIComponent(S.edition) + '&key=' + encodeURIComponent(key)); const j = await r.json(); if (!j.ok) return false; STATS = j.submissions; return true; } catch (e) { return false; }
}
function vStats() {
  $('#sub').textContent = 'Statistiche · edizione ' + S.edition;
  setNav('');
  const t = TESTS[S.statsTest];
  const subs = STATS.filter((s) => s.test === t.key && s.attempt === 1);
  const per = t.q.map((q) => { let n = 0, ok = 0; subs.forEach((s) => { const r = s.answers.find((a) => a.q === q.id); if (r) { n++; ok += r.ok; } }); return { q, n, ok, p: n ? ok / n : null }; });
  const avg = subs.length ? subs.reduce((a, s) => a + s.score / s.n, 0) / subs.length : null;
  const worst = [...per].filter((x) => x.n).sort((a, b) => a.p - b.p).slice(0, 3);
  $('#app').innerHTML = `<p class="eyebrow">Solo per il docente</p><h1>Giuste e sbagliate</h1>
  <div class="seg" role="group" style="flex-wrap:wrap">${TESTS.map((x, i) => `<button aria-pressed="${i === S.statsTest}" data-t="${i}" style="min-width:48px">T${i + 1}</button>`).join('')}</div>
  <div class="card"><b>${esc(t.title)}</b><br>Partecipanti (prima consegna): <b>${subs.length}</b>${avg === null ? '' : ' · punteggio medio: <b>' + Math.round(avg * 100) + '%</b>'}</div>
  ${worst.length ? `<div class="card"><b>Da riprendere in aula</b><ol style="margin:8px 0 0;padding-left:20px">${worst.map((w) => `<li>${w.q.id}: ${esc(w.q.text)} <span class="badge">${Math.round(w.p * 100)}% giuste</span></li>`).join('')}</ol></div>` : '<p class="small">Nessuna risposta raccolta per questo test.</p>'}
  <div class="bars">${per.map((x) => `<div class="brow"><span>${x.q.id} · ${esc(x.q.text.length > 90 ? x.q.text.slice(0, 90) + '…' : x.q.text)}</span><b>${x.n ? Math.round(x.p * 100) + '%' : '—'}</b><div class="bb ${x.p !== null && x.p < .5 ? 'low' : ''}"><span style="width:${x.p === null ? 0 : x.p * 100}%"></span></div></div>`).join('')}</div>
  <p class="small">${CONFIG.endpoint ? 'Dati raccolti per questa edizione.' : 'Modalità prova: sono mostrati solo i test fatti su questo dispositivo.'}</p>
  <div class="stack"><button class="btn" id="csv">Scarica i dati (CSV)</button></div>`;
  document.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { S.statsTest = +b.dataset.t; keepScroll(() => vStats()); });
  $('#csv').onclick = () => {
    const L = ['edizione;partecipante;test;tentativo;domanda;giusta;frazione;risposta;data'];
    STATS.forEach((s) => s.answers.forEach((a) => L.push([s.edition, s.pid, s.test, s.attempt, a.q, a.ok, a.f, '"' + a.g + '"', s.ts].join(';'))));
    const blob = new Blob(['﻿' + L.join('\n')], { type: 'text/csv;charset=utf-8' }); const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = 'risposte-' + S.edition + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
  };
}
/* ---------- avvio ---------- */
$('#hbtn').onclick = () => { S.view = 'home'; render(); };
(function init() {
  const p = new URLSearchParams(location.search), e = (p.get('e') || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
  const last = LS.get('pmt:last', {});
  if (e) enter(e); else if (last.edition) { S.edition = last.edition; enter(last.edition); } else { S.view = 'start'; render(); }
})();
</script>
